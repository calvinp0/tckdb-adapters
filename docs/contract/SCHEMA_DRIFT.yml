- path: "reaction_upload.species[].applied_energy_corrections[].components[]"
  change: "semantics_changed"
  from: "a bac_total with no components was stored as a bare total"
  to: >-
    422 bac_total_requires_components for a componentless bac_petersson bac_total on a BONDED species (monatomic
    species exempt; bac_melius exempt)
  breaking_for_producer: true
  commit: "9b412250"
  phase_b_note: 'Phase B ruling (0.51 refresh): flipped from false. Current ARC (main db0934d5) drops a Petersson BAC''s entire components list when any bond lacks a parameter (ARC:arc/output.py:1592-1596) but still exports the total, and the adapter forwards `components or []` (tckdb_arc/tckdb_arc/adapter.py:303) and drops any remaining component with a null parameter_value (adapter.py:5020-5028). A bonded species with an unparameterised bond therefore reaches TCKDB as a componentless bac_petersson bac_total and the whole upload is refused 422. Conditional (needs a bond outside Arkane''s Petersson table at that level); no fixture exercises it.'
  source: "backend/app/services/energy_correction_resolution.py:604"
