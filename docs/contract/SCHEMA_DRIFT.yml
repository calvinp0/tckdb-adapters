# repo: TCKDB_v2
#
# A5 — schema drift ledger. Rows conform to FIELD_KEY.md's A5 schema.
# Diff: git diff tckdb-schemas-v0.8.0..HEAD -- schemas/python/tckdb-schemas/tckdb_schemas/
# HEAD declares tckdb-schemas 0.22.0 and is UNTAGGED.
#
# `source` is repo-relative to TCKDB_v2 and points at the CURRENT (HEAD) location.
# One row per path. Where a field was introduced and then reshaped inside the
# range (e.g. atom_to_ts), the row records the NET state at HEAD and cites the
# introducing commit; the intermediate churn is in SCHEMA_DRIFT.md.

