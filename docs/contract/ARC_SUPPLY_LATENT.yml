# ===========================================================================
# 8. LEVELS OF THEORY AND CALCULATION STRUCTURE
# ===========================================================================

- path: species_upload.conformers[].primary_calculation.level_of_theory
  arc_location: "ARCSpecies.opt_level"
  in_memory_form: >-
    Level object, per-species. Set when adaptive_levels are in use, where
    different species run at different levels keyed by heavy-atom count.
  computed_when: "populated for every species; differs from the run-level opt_level only under adaptive_levels"
  reachable_from_export: true
  export_effort: trivial
  effort_rationale: >-
    output.yml emits exactly one run-level opt_level/freq_level/sp_level
    block (arc/output.py:128) and no per-species level. Under
    adaptive_levels that is simply wrong for some species. spc.opt_level is
    an attribute of the in-scope species and _level_to_dict already exists;
    emitting it per species inside _spc_to_dict is a one-line addition.
  blocker: null
  source: arc/species/species.py:430

- path: species_upload.conformers[].primary_calculation.depends_on[].role
  arc_location: "output_dict[label]['paths'] ordering + arc/scheduler.py job spawning order"
  in_memory_form: >-
    Implicit in ARC's fixed pipeline: geo_coarse -> geo -> freq -> sp,
    scans branch off geo. output.yml records the paths but no edges.
    TCKDB's CalculationDependencyRole enum (optimized_from, freq_on,
    single_point_on, scan_parent, irc_start) matches ARC's pipeline exactly.
  computed_when: "always"
  reachable_from_export: true
  export_effort: moderate
  effort_rationale: >-
    The dependency edges are derivable from the paths dict already in scope
    plus ARC's invariant that freq and sp run on the final opt geometry.
    Moderate because it requires minting calculation keys (output.yml has
    none — calculations are identified by field name, e.g. 'freq_log') so
    that edges have endpoints to name.
  blocker: null
  source: arc/scheduler.py:144

- path: species_upload.conformers[].primary_calculation.artifacts[]
  arc_location: "ARCSpecies.checkfile; JobAdapter.local_path_to_orbitals_file / local_path_to_check_file / local_path_to_hess_file"
  in_memory_form: >-
    spc.checkfile is a str path to the latest Gaussian .chk, live on the
    species. The .fchk (orbitals) and .hess paths live only on JobAdapter
    objects. TCKDB's ArtifactIn requires content_base64, not a path.
  computed_when: "checkfile: whenever a Gaussian job ran and keep_checks was set"
  reachable_from_export: true
  export_effort: hard
  effort_rationale: >-
    The species-level checkfile PATH is trivially reachable, but TCKDB
    wants embedded base64 content, so exporting an artifact means reading
    and encoding potentially large binary files inside the output writer —
    a different class of change from adding a scalar. Note also that
    arc/main.py:614 deletes check files before write_output_yml runs unless
    keep_checks is set, so for a default run the artifact is already gone
    by export time.
  blocker: "delete_check_files() runs before write_output_yml unless keep_checks is set."
  source: arc/species/species.py:380

- path: species_upload.conformers[].primary_calculation.parameters[]
  arc_location: "JobAdapter.args (keyword/block dicts) and Level.args"
  in_memory_form: >-
    dict {'keyword': {...}, 'block': {...}} of ESS-specific execution
    controls. Level.args IS already exported via _level_to_dict (the level
    as_dict includes 'args'), but the PER-JOB args — including every
    keyword the troubleshooting layer (arc/job/trsh.py) added after a
    failure — live on the JobAdapter and are lost.
  computed_when: "always for every job; trsh additions only after a failure"
  reachable_from_export: false
  export_effort: hard
  effort_rationale: >-
    write_output_yml receives no Job objects. The per-job final args are
    the difference between "what ARC asked for" and "what actually ran",
    which is exactly what CalculationParameterObservation is for. Closing
    it needs a JobAdapter -> species-record handoff; arc/output.py:1204
    already names this as the future producer for opt_final_settings.
  blocker: >-
    scheduler.job_dict is not passed to write_output_yml. Requires a
    per-job record persisted onto the species (or into output_dict) at job
    completion time.
  source: arc/job/adapter.py:642

- path: species_upload.conformers[].primary_calculation.execution_environment
  arc_location: "arc/job/env_run.py, arc/job/adapter.py (server/queue/cpu/memory), arc/settings"
  in_memory_form: >-
    Scattered: JobAdapter.server (str), .queue (str), .cpu_cores (int),
    .job_memory_gb (float), .submit_script_memory_mib, .max_job_time (h),
    .run_time (timedelta), .attempted_queues; plus the conda env name from
    settings['RMG_ENV_NAME'] and the launcher resolved by
    env_run._detect_launcher.
  computed_when: "always, per job"
  reachable_from_export: false
  export_effort: hard
  effort_rationale: >-
    None of it reaches the writer, and TCKDB's manifest additionally wants
    content-addressed digests (lockfile / module closure / executable
    digest) that ARC never computes at all. Even with full Job plumbing
    the digests would be new work. The DescribedRuntime variant (a free
    description plus module name/version pairs) is the only realistically
    reachable shape.
  blocker: >-
    Job objects unreachable AND ARC computes no content digests for its
    runtime, executable or environment.
  source: arc/job/adapter.py:591

- path: species_upload.conformers[].primary_calculation.software_release.version
  arc_location: "Level.software_version; arc/parser/parser.py parse_ess_version"
  in_memory_form: >-
    ESS versions ARE exported (d['ess_versions'], arc/output.py:1220) but
    only for the sp/opt/freq/neb logs of a converged species. Level also
    carries a declared .software_version that is never emitted, and the
    scan/irc/composite logs are never version-parsed.
  computed_when: "ess_versions: only when converged is True"
  reachable_from_export: true
  export_effort: trivial
  effort_rationale: >-
    Extending _get_ess_versions' key_map (arc/output.py:574) to cover irc
    and composite paths, and dropping the `if converged` guard, are both
    one-line changes; the version of the ESS that produced a NON-converged
    log is exactly what a failure post-mortem needs.
  blocker: null
  source: arc/output.py:574

- path: species_upload.statmech.freq_scale_factor.software
  arc_location: "arc/output.py:_resolve_freq_scale_factor_source, data/freq_scale_factors.yml"
  in_memory_form: >-
    The scale factor value and a free-text literature citation string ARE
    exported (freq_scale_factor, freq_scale_factor_source). The ESS the
    factor applies to is implicit in the level key
    (str(freq_level) includes the software) and is never emitted as a
    field, nor is the citation ever structured.
  computed_when: "always when the level is in ARC's scale-factor database"
  reachable_from_export: true
  export_effort: trivial
  effort_rationale: >-
    freq_level is already a parameter of write_output_yml and its
    .software attribute is read three lines away (arc/output.py:148).
  blocker: null
  source: arc/output.py:284

# ===========================================================================
# 9. RUN AND SPECIES METADATA
# ===========================================================================

- path: arc_only.species.run_time
  arc_location: "ARCSpecies.run_time, aggregated in arc/scheduler.py:3364 from per-job run_times"
  in_memory_form: "datetime.timedelta — the summed/extremum wall time across this species' jobs"
  computed_when: "always; accumulated as jobs complete"
  reachable_from_export: true
  export_effort: trivial
  effort_rationale: >-
    Already aggregated onto the species by the scheduler, so unlike the
    per-job timings it needs no Job plumbing — str(spc.run_time) in
    _spc_to_dict. output.yml records run start and end timestamps for the
    project but nothing per species.
  blocker: null
  source: arc/scheduler.py:3364

- path: arc_only.species.long_thermo_description
  arc_location: "ARCSpecies.long_thermo_description"
  in_memory_form: >-
    str, accumulating; includes the bond-corrections dict, rotor treatment
    notes and level-of-theory narrative that ARC writes into its RMG thermo
    library entry.
  computed_when: "always for a species with computed thermo"
  reachable_from_export: true
  export_effort: trivial
  effort_rationale: >-
    _rxn_to_dict already exports the reaction analogue
    (long_kinetic_description, arc/output.py:1942); the species analogue
    is simply not read. Symmetric one-line addition.
  blocker: null
  source: arc/species/species.py:429

- path: arc_only.species.rmg_thermo
  arc_location: "ARCSpecies.rmg_thermo"
  in_memory_form: "ThermoData with H298 (kJ/mol) and S298 (J/mol*K) estimated by RMG's database for comparison"
  computed_when: "only when compare_to_rmg is True"
  reachable_from_export: true
  export_effort: trivial
  effort_rationale: >-
    _thermo_to_dict already exists and would serialise it unchanged; the
    writer just never looks at rmg_thermo. It is the estimate ARC's
    computed value was checked against.
  blocker: null
  source: arc/species/species.py:362

- path: arc_only.species.transport_data
  arc_location: "ARCSpecies.transport_data (RMG TransportData), populated by set_transport_data"
  in_memory_form: >-
    shapeIndex (int), epsilon (J/mol), sigma (m), dipoleMoment (Debye,
    parsed from the opt log by parse_dipole_moment), polarizability
    (Angstrom^3, from parse_polarizability on the freq log),
    rotrelaxcollnum, comment.
  computed_when: "only when compute_transport is True and a OneDMin job ran"
  reachable_from_export: true
  export_effort: trivial
  effort_rationale: >-
    Live attribute of the in-scope species. TCKDB has no transport model at
    all — this is candidate demand. Note the dipole moment and
    polarizability are genuine ESS-parsed molecular properties that ARC
    currently only surfaces inside a Lennard-Jones comment string.
  blocker: null
  source: arc/species/species.py:381

- path: arc_only.species.irc_label
  arc_location: "ARCSpecies.irc_label"
  in_memory_form: >-
    str. On a TS: the two space-separated labels of the species obtained by
    optimising its IRC endpoints. On an IRC-derived species: the label of
    the TS it came from.
  computed_when: "only when IRC endpoint optimisations were spawned"
  reachable_from_export: true
  export_effort: trivial
  effort_rationale: >-
    output.yml exports irc_logs and irc_converged but not the link between
    a TS and the species its IRC actually produced — which is the join a
    consumer needs to verify the saddle point connects the declared wells
    without re-perceiving geometries.
  blocker: null
  source: arc/species/species.py:375

- path: arc_only.species.bdes
  arc_location: "ARCSpecies.bdes; results processed by arc/processor.py:353 process_bdes"
  in_memory_form: >-
    list of 1-INDEXED bonded-atom-index tuples (or the string 'all_h'). The
    computed BDE values are written to a separate BDE report by
    process_bdes and never enter output.yml.
  computed_when: "only when the user requested BDEs"
  reachable_from_export: true
  export_effort: moderate
  effort_rationale: >-
    The request list is a trivial attribute, but the computed BDE VALUES
    live in process_bdes' own output and are not stored back on the
    species, so exporting the science (not just the request) needs
    process_bdes to return its results into the species record.
  blocker: "Computed BDE values are written to a report, not retained on the species."
  source: arc/species/species.py:413

- path: arc_only.output_yml.run_settings
  arc_location: "ARC.main attributes at the write site: job_types, ts_adapters, allow_nonisomorphic_2d, skip_nmd, n_confs, e_confs, trsh_ess_jobs, trsh_rotors, fine_only, max_job_time, adaptive_levels"
  in_memory_form: "assorted scalars and dicts on the ARC object, in scope in arc/main.py at the call site"
  computed_when: "always"
  reachable_from_export: true
  export_effort: trivial
  effort_rationale: >-
    write_output_yml is already called from inside ARC.execute() with all
    of these in scope; only irc_requested (job_types['irc']) is currently
    threaded through. Adding a run_settings block is extra keyword
    arguments at one call site (arc/main.py:649). These are the knobs that
    decide whether an absent field means "not requested" or "failed" —
    the same distinction the evidence sidecar's unavailable envelope exists
    to preserve.
  blocker: null
  source: arc/main.py:649
