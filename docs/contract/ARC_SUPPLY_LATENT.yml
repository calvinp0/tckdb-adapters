# repo: ARC.worktrees/feature_arc_result_export_contract
#
# A3 — ARC latent supply. Fields ARC computes or already holds in memory but
# does NOT write to output.yml / tckdb_evidence.json.
#
# Reachability baseline (cited once here, referenced by every row):
# arc/main.py:649 calls write_output_yml(species_dict=self.scheduler.species_dict,
# reactions=self.scheduler.rxn_list, output_dict=self.output, ...). The FULL
# ARCSpecies and ARCReaction object graphs are therefore live at the write point;
# the JobAdapter objects (scheduler.job_dict) are NOT passed and are unreachable.
# Every `reachable_from_export: true` below means "an attribute of an ARCSpecies
# or ARCReaction already in scope in arc/output.py"; every `false` means "lives on
# a Job/Scheduler object that write_output_yml never receives".

# ===========================================================================
# 1. ATOM MAPPING  (arc/mapping/) — the headline finding
# ===========================================================================

- path: reaction_upload.atom_map.participants[].atom_to_ts
  arc_location: "ARCReaction.atom_map property -> arc.mapping.driver.map_reaction"
  in_memory_form: >-
    list[int]. ARC's native map is REACTANT->PRODUCT, not participant->TS:
    entry i is the running 0-based atom index of reactant atom i in the
    concatenated product atom ordering. Both sides 0-based; validated by
    check_atom_map_and_return to be a permutation of 0..N-1
    (arc/mapping/driver.py:79). TCKDB wants a per-participant
    dict[int,int] of {participant-local 1-based index: TS 1-based index},
    so BOTH an index-base shift (+1) and a re-shaping are required.
    ARC-generated TS guesses are built in concatenated-reactant atom order
    (arc/job/adapters/ts/linear.py:1649, :3508 "in reactant atom ordering";
    arc/job/adapters/ts/rits_ts.py:27), which supplies the reactant leg as
    the identity map r_local+offset -> ts_index, and the product leg as
    atom_map[r] -> ts_index inverted. UNVERIFIED: whether the AutoTST, GCN,
    KinBot and GoFlow TS adapters also preserve concatenated-reactant atom
    order; neither those modules nor the scheduler assert it, so a
    universal identity claim cannot be made from the code alone.
  computed_when: >-
    Lazily on first attribute access, for any reaction whose reactants and
    products all have an xyz; cached in _atom_map. Independent of whether a
    TS was located. Returns None (and logs an error) when mapping fails.
  reachable_from_export: true
  export_effort: moderate
  effort_rationale: >-
    rxn.atom_map is one attribute access away in _rxn_to_dict. The moderate
    rating is entirely about correctness, not plumbing: emitting the raw
    list is trivial, but emitting TCKDB's participant->TS shape requires
    (a) +1 on both sides, (b) splitting the running index into
    (participant_index, participant-local index) using per-species atom
    counts, (c) an explicit statement that the TS geometry ordering equals
    the concatenated reactant ordering, which ARC relies on but never
    asserts. Recommended intermediate step: export the raw 0-based
    reactant->product permutation plus per-species atom counts under
    arc_only, and let the adapter do the reshaping where it can also see
    the TS geometry.
  blocker: null
  source: arc/reaction/reaction.py:156

- path: reaction_upload.atom_map.participants[].participant_index
  arc_location: "ARCReaction.r_species / p_species ordering"
  in_memory_form: >-
    Implicit: position in rxn.r_species / rxn.p_species (0-based list
    position). TCKDB wants 1-based position on its side.
  computed_when: "always (reaction construction)"
  reachable_from_export: true
  export_effort: trivial
  effort_rationale: >-
    enumerate(rxn.r_species, start=1) at the write site. The only subtlety
    is that remove_dup_species() (arc/reaction/reaction.py:652) collapses
    duplicate labels, so a 2 CH3 -> C2H6 reaction has one r_species entry
    for two participants; the duplicate count must come from
    get_species_count() rather than len(r_species).
  blocker: null
  source: arc/reaction/reaction.py:756

- path: reaction_upload.atom_map.participants[].side
  arc_location: "ARCReaction.r_species vs ARCReaction.p_species"
  in_memory_form: "implicit in which list the ARCSpecies sits on; str 'reactant'/'product' after mapping"
  computed_when: "always"
  reachable_from_export: true
  export_effort: trivial
  effort_rationale: "Literal per loop over the two lists; no computation."
  blocker: null
  source: arc/reaction/reaction.py:107

- path: reaction_upload.atom_map.participants[].species_key
  arc_location: "ARCReaction.reactants / .products (label strings)"
  in_memory_form: "list[str] of ARCSpecies labels, already sanitised by check_label"
  computed_when: "always"
  reachable_from_export: true
  export_effort: trivial
  effort_rationale: >-
    Labels are already exported as reactant_labels / product_labels in
    _rxn_to_dict; the atom-map block only needs to reuse them as keys.
  blocker: null
  source: arc/output.py:1935

- path: reaction_upload.atom_map.participants[].geometry_key
  arc_location: "arc/output.py:_spc_to_dict (per-species 'xyz' field)"
  in_memory_form: >-
    No key exists in ARC — output.yml identifies geometries by species
    label only, with a single 'xyz' per species record. A bundle-local
    geometry key would have to be minted.
  computed_when: "n/a"
  reachable_from_export: true
  export_effort: moderate
  effort_rationale: >-
    Requires introducing a stable geometry-key convention in output.yml
    (e.g. '<label>:final') so the atom map can name the geometry its
    indices count into — which ADR 0011 makes mandatory. This is a schema
    decision, not a data-availability problem.
  blocker: null
  source: arc/output.py:1041

- path: reaction_upload.atom_map.ts_geometry_key
  arc_location: "arc/output.py:_spc_to_dict for the TS species (transition_states[].xyz)"
  in_memory_form: "no key; the TS geometry is addressed by rxn.ts_label / spc.label"
  computed_when: "only for reactions with a located TS"
  reachable_from_export: true
  export_effort: moderate
  effort_rationale: >-
    Same geometry-key minting problem as participants[].geometry_key. The
    TS geometry itself is already exported; only the addressable key is
    missing.
  blocker: null
  source: arc/output.py:1282

- path: reaction_upload.atom_map.source
  arc_location: "arc/mapping/driver.py:map_reaction"
  in_memory_form: >-
    Not represented. ARC always derives the map algorithmically, so the
    correct constant is 'inferred' — never 'declared' — EXCEPT when the
    user set rxn.atom_map explicitly via the setter or the restart dict,
    which ARC does not currently distinguish from a derived map.
  computed_when: "always when a map exists"
  reachable_from_export: true
  export_effort: moderate
  effort_rationale: >-
    Emitting the constant 'inferred' is trivial, but doing it honestly
    requires ARC to record whether _atom_map was set by map_reaction or by
    the setter (arc/reaction/reaction.py:167) / restored from a restart
    dict (arc/reaction/reaction.py:352). Today those three provenances are
    indistinguishable, and ADR 0011 exists precisely to keep them apart.
  blocker: >-
    Needs a provenance flag on ARCReaction (e.g. _atom_map_source) set at
    each of the three assignment sites.
  source: arc/reaction/reaction.py:158

- path: reaction_upload.atom_map.note
  arc_location: "arc/mapping/driver.py:map_reaction"
  in_memory_form: >-
    Not stored. The algorithm identity is knowable statically: the family
    path (map_rxn), the general/isomerization path (map_general_rxn), or
    the flipped retry (flip_map). TCKDB REQUIRES this note whenever
    source='inferred'.
  computed_when: "always when a map exists"
  reachable_from_export: true
  export_effort: moderate
  effort_rationale: >-
    map_reaction currently returns only the list and discards which of its
    three branches produced it. Returning a (map, branch_name) pair and
    stashing the branch on the reaction is a small change confined to
    arc/mapping/driver.py plus the ARCReaction property.
  blocker: null
  source: arc/mapping/driver.py:57

- path: reaction_upload.atom_map.equivalent_map_count
  arc_location: "arc/checks/nmd.py:find_equivalent_atoms / identify_equivalent_atoms_in_molecule"
  in_memory_form: >-
    UNVERIFIED: find_equivalent_atoms returns equivalence classes of atoms
    (used to accept an NMD check under any equivalent mapping), not a count
    of symmetry-equivalent whole maps. Converting equivalence classes into
    TCKDB's equivalent_map_count is a real derivation, not a lookup, and I
    could not establish that the classes it produces are complete enough to
    make the count sound.
  computed_when: "only during the TS normal-mode-displacement check"
  reachable_from_export: false
  export_effort: hard
  effort_rationale: >-
    The equivalence classes are computed inside a check that runs against a
    live freq JobAdapter and are discarded; nothing is stored on the
    species. Even with plumbing, turning classes into a defensible map
    count needs new science, and TCKDB explicitly prefers null to a wrong 1.
  blocker: "Computed transiently inside checks against a Job object; never retained."
  source: arc/checks/nmd.py:480

- path: arc_only.reaction.atom_map
  arc_location: "ARCReaction.atom_map"
  in_memory_form: >-
    list[int], 0-based, length = total reactant atom count; entry i is the
    product-side running index of reactant atom i. This is ARC's native
    artefact and has no direct TCKDB equivalent (TCKDB indexes against the
    TS, not across the reaction).
  computed_when: "always for reactions whose reactants and products all have xyz"
  reachable_from_export: true
  export_effort: trivial
  effort_rationale: >-
    One line in _rxn_to_dict: rxn_dict['atom_map'] = rxn.atom_map. Should
    be emitted alongside per-species atom counts and an explicit
    index_base: 0 field so no consumer can mistake the base. This is the
    single highest value-per-line change in this inventory.
  blocker: null
  source: arc/reaction/reaction.py:83

- path: arc_only.reaction.formed_and_broken_bonds
  arc_location: "ARCReaction.get_formed_and_broken_bonds / get_changed_bonds"
  in_memory_form: >-
    tuple[list[tuple[int,int]], list[tuple[int,int]]] of atom-index pairs,
    0-based, expressed in the REACTANT running index space (product bonds
    are pulled back through atom_map). Raises ReactionError if atom_map is
    None.
  computed_when: "on demand; requires a successful atom map"
  reachable_from_export: true
  export_effort: trivial
  effort_rationale: >-
    Method call on the in-scope reaction object, wrapped in the existing
    _safe() helper because it raises when the map is missing.
  blocker: null
  source: arc/reaction/reaction.py:993

- path: arc_only.reaction.expected_changing_bonds
  arc_location: "ARCReaction.get_expected_changing_bonds -> ReactionFamily.actions"
  in_memory_form: >-
    tuple of BREAK_BOND / FORM_BOND atom-index pairs taken from the RMG
    family recipe, keyed by template labels ('*1','*2','*3'); indices are
    0-based reactant running indices via r_label_dict.
  computed_when: "only when rxn.family is not None"
  reachable_from_export: true
  export_effort: moderate
  effort_rationale: >-
    Needs r_label_dict, which is produced inside the mapping driver
    (map_rxn) rather than stored on the reaction; the recipe actions
    themselves are one ReactionFamily(label=rxn.family).actions away.
  blocker: "r_label_dict is a local of arc/mapping/driver.py:map_rxn and is not retained."
  source: arc/reaction/reaction.py:806

- path: arc_only.reaction.rxn_smiles
  arc_location: "ARCReaction.get_rxn_smiles"
  in_memory_form: "str, 'r1.r2>>p1.p2'; raises ValueError if any SMILES is unavailable"
  computed_when: "always when every participant has a perceivable mol"
  reachable_from_export: true
  export_effort: trivial
  effort_rationale: "Single guarded method call in _rxn_to_dict."
  blocker: null
  source: arc/reaction/reaction.py:1063

# ===========================================================================
# 2. TRANSITION-STATE VALIDATION  (arc/checks/)
# ===========================================================================

- path: reaction_upload.transition_state.validation_evidence[].passed
  arc_location: "ARCSpecies.ts_checks['IRC'] set by arc/checks/ts.py:check_irc_species_and_rxn"
  in_memory_form: "bool | None inside the ts_checks dict; None = not yet run"
  computed_when: "only when an IRC job ran for a located TS and its two endpoints were optimized"
  reachable_from_export: true
  export_effort: trivial
  effort_rationale: >-
    spc.ts_checks is a plain dict on the TS ARCSpecies, live in
    _spc_to_dict where is_ts is already branched on. output.yml today
    emits irc_converged (did the IRC job converge) but NOT this — whether
    the IRC endpoints actually match the declared reactants and products,
    which is the scientifically load-bearing claim.
  blocker: null
  source: arc/checks/ts.py:517

- path: reaction_upload.transition_state.validation_evidence[].kind
  arc_location: "arc/checks/ts.py:check_irc_species_and_rxn"
  in_memory_form: "not represented; the constant 'irc' is the only kind TCKDB accepts"
  computed_when: "same as .passed"
  reachable_from_export: true
  export_effort: trivial
  effort_rationale: "Literal constant emitted alongside the ts_checks['IRC'] boolean."
  blocker: null
  source: arc/checks/ts.py:497

- path: reaction_upload.transition_state.validation_evidence[].rationale
  arc_location: "ARCSpecies.ts_checks['warnings'] and ARCSpecies.ts_report"
  in_memory_form: >-
    ts_checks['warnings'] is an accumulating str (semicolon-joined);
    ts_report is a str describing every TS-guess method and its ranking.
    Neither is exported.
  computed_when: "populated during TS checks; ts_report during TS search"
  reachable_from_export: true
  export_effort: trivial
  effort_rationale: >-
    Both are string attributes of the TS ARCSpecies. TCKDB requires a
    non-empty rationale, and the check code also distinguishes the
    isomorphism path from the distance-matrix fallback in log messages —
    capturing which path decided the verdict would need one extra field on
    the species, otherwise the rationale can only say "IRC endpoints
    matched" without saying how.
  blocker: null
  source: arc/species/species.py:2246

- path: reaction_upload.transition_state.validation_evidence[].reactant_participant_mapping
  arc_location: "arc/checks/ts.py:_perceive_irc_fragments + _match_fragments_to_species"
  in_memory_form: >-
    COMPUTED AND DISCARDED. _perceive_irc_fragments builds
    `fragment_indices` — a list of 0-based atom index lists, one per
    connected component of the IRC endpoint geometry — then returns only
    the perceived Molecule objects. _match_fragments_to_species then finds
    the one-to-one fragment<->expected-species assignment by backtracking
    and returns only a bool. Together these two are exactly TCKDB's
    {participant_key: [atom indices]} mapping, and both throw it away.
    Indices count into the IRC-endpoint geometry, which inherits the TS
    input atom ordering (the IRC job starts from the TS and the subsequent
    opt preserves atom order), so they are TS atom indices — 0-based, and
    TCKDB requires 1-based.
  computed_when: "only when an IRC ran, both endpoints were perceived, and the graph-isomorphism path (not the dmat fallback) was taken"
  reachable_from_export: false
  export_effort: moderate
  effort_rationale: >-
    The values exist but are local. Change _perceive_irc_fragments to
    return (molecules, fragment_indices), _match_fragments_to_species to
    return the assignment instead of a bool, and have
    check_irc_species_and_rxn stash the resulting participant->indices dict
    on rxn.ts_species (next to ts_checks). Then it is reachable and a
    +1 shift away. Note TCKDB refuses a PARTIAL map presented as passing,
    so the fallback (bond-list) path must emit evidence with no mappings
    rather than an incomplete one.
  blocker: >-
    Both producing functions currently narrow their return type to
    bool / list[Molecule]; nothing is stored on the species.
  source: arc/checks/ts.py:588

- path: reaction_upload.transition_state.validation_evidence[].product_participant_mapping
  arc_location: "arc/checks/ts.py:_perceive_irc_fragments + _match_fragments_to_species (second endpoint)"
  in_memory_form: "identical to the reactant side; 0-based TS-frame atom index lists per product fragment"
  computed_when: "same as the reactant mapping"
  reachable_from_export: false
  export_effort: moderate
  effort_rationale: >-
    Same single change as the reactant side — the two endpoints go through
    the same two helpers. TCKDB rejects a one-sided map, so both must be
    plumbed together or neither.
  blocker: "Same as reactant_participant_mapping."
  source: arc/checks/ts.py:589

- path: arc_only.species.ts_checks
  arc_location: "ARCSpecies.ts_checks"
  in_memory_form: >-
    dict with keys 'E0', 'e_elect', 'IRC', 'freq', 'NMD' (each bool|None)
    plus 'warnings' (str). None means "not evaluated", which is distinct
    from False.
  computed_when: "populated for every TS species; individual keys filled as the corresponding check runs"
  reachable_from_export: true
  export_effort: trivial
  effort_rationale: >-
    Direct dict copy in the is_ts branch of _spc_to_dict. This is ARC's
    complete self-assessment of a saddle point and none of it is currently
    written down — output.yml records only irc_converged and the imaginary
    frequency count.
  blocker: null
  source: arc/species/species.py:2241

- path: arc_only.species.rxn_zone_atom_indices
  arc_location: "ARCSpecies.rxn_zone_atom_indices, set from arc/checks/ts.py:get_rxn_zone_atom_indices"
  in_memory_form: >-
    list[int], 0-based, sorted ascending — the atoms with the largest
    mass-weighted RMS displacement in the imaginary normal mode, i.e.
    ARC's identification of the reacting core.
  computed_when: "only for a TS whose freq job produced parseable normal-mode displacements"
  reachable_from_export: true
  export_effort: trivial
  effort_rationale: >-
    Plain list attribute on the TS ARCSpecies. Needs an explicit
    index_base: 0 marker on export — the neighbouring exported field
    (torsions[].atom_indices) is 1-based, so an unlabelled sibling list
    is an off-by-one waiting to happen.
  blocker: null
  source: arc/species/species.py:387

- path: reaction_upload.transition_state.calculations[].freq_result.reaction_coordinate_mode_index
  arc_location: "arc/checks/ts.py:get_index_of_abs_largest_neg_freq"
  in_memory_form: "int, 0-BASED index into the frequency array of the mode used as the reaction coordinate"
  computed_when: "whenever the NMD check runs on a TS with at least one imaginary frequency"
  reachable_from_export: false
  export_effort: moderate
  effort_rationale: >-
    The index is computed inside the NMD check against a live freq
    JobAdapter and never stored. However it is trivially recomputable at
    write time from spc.freqs, which IS in scope: argmin over the negative
    entries. Recomputing (rather than plumbing) makes this a small,
    self-contained change in arc/output.py — but it must be +1'd, because
    TCKDB's FrequencyModePayload.mode_index is 1-based (ge=1).
  blocker: "Not stored; either plumb from checks/ts.py or recompute from spc.freqs at write time."
  source: arc/checks/ts.py:409

- path: reaction_upload.transition_state.calculations[].freq_result.modes[].imaginary_disposition
  arc_location: "ARCSpecies.ts_checks['NMD'] (arc/checks/nmd.py:analyze_ts_normal_mode_displacement)"
  in_memory_form: >-
    bool | None. True means the imaginary mode's displacement is consistent
    with the family's expected forming/breaking bonds — i.e. the mode IS
    the reaction coordinate. ARC does not classify the OTHER imaginary
    modes of a TS that has more than one, so only the reaction-coordinate
    disposition is derivable; the rest would have to be 'unassigned'.
  computed_when: "only for a TS with a family and a parseable freq log, and only when skip_nmd is False"
  reachable_from_export: true
  export_effort: moderate
  effort_rationale: >-
    The boolean is on the species, but mapping it onto TCKDB's per-mode
    enum requires pairing it with the mode index (previous row) and
    deciding what to emit for the additional imaginary modes ARC never
    inspects. 'unassigned' is a legitimate honest answer there per the
    enum's own docstring.
  blocker: null
  source: arc/checks/ts.py:285

# ===========================================================================
# 3. TS SEARCH PROVENANCE  (arc/job/adapters/ts/, arc/scheduler.py)
# ===========================================================================

- path: arc_only.output_yml.ts_guesses
  arc_location: "ARCSpecies.ts_guesses (list[TSGuess])"
  in_memory_form: >-
    list[TSGuess]. Each carries index (int), method (str), method_index,
    method_direction (str), method_sources (list[str]), success (bool),
    energy (float, kJ/mol relative), imaginary_freqs (list[float], cm^-1),
    execution_time (timedelta), conformer_index, errors (str), cluster,
    log_path, method_source_paths (dict[str,str]).
  computed_when: "always for a TS species; one entry per TS-guess attempt across all admitted adapters"
  reachable_from_export: true
  export_effort: trivial
  effort_rationale: >-
    output.yml deliberately emits ONLY the chosen guess and only four of
    its fields (arc/output.py:1251), with a comment explaining that
    TSGuess.as_dict() carries absolute paths and diagnostic state. The
    non-chosen guesses — which are the whole record of what was tried and
    rejected — are dropped entirely. Emitting the same four safe fields
    for every guess, plus success/energy/imaginary_freqs, is a loop change
    at an existing write site.
  blocker: null
  source: arc/output.py:1251

- path: arc_only.species.unsuccessful_methods
  arc_location: "ARCSpecies.unsuccessful_methods"
  in_memory_form: "list[str] of TS-search method names that failed to produce a usable guess"
  computed_when: "always for a TS species"
  reachable_from_export: true
  export_effort: trivial
  effort_rationale: >-
    output.yml exports successful_ts_methods (arc/output.py:1224) but not
    its complement, so a consumer cannot tell "not tried" from "tried and
    failed" — the same distinction TCKDB's own unavailable-envelope design
    treats as essential.
  blocker: null
  source: arc/species/species.py:421

- path: arc_only.species.ts_guesses_exhausted
  arc_location: "ARCSpecies.ts_guesses_exhausted"
  in_memory_form: "bool — True when every guess was tried without convergence"
  computed_when: "always for a TS species"
  reachable_from_export: true
  export_effort: trivial
  effort_rationale: "Plain bool attribute; one dict entry in the is_ts branch."
  blocker: null
  source: arc/species/species.py:408

- path: reaction_upload.transition_state.calculations[].path_search_result.is_double_ended
  arc_location: "TSGuess.method / arc/job/adapters/ts/orca_neb.py, xtb_gsm.py"
  in_memory_form: >-
    Not represented as a field. Statically known per adapter: orca_neb and
    xtb_gsm are double-ended (they consume rxn.get_reactants_xyz and
    get_products_xyz as endpoints), heuristics/linear/gcn are not.
  computed_when: "only when a path-search TS adapter produced the chosen guess"
  reachable_from_export: true
  export_effort: trivial
  effort_rationale: >-
    A constant lookup keyed by the already-exported chosen_ts_method
    string. The mapping table would live next to the existing
    _TS_GUESS_METHOD_TO_LOG_FIELD dict in arc/output.py.
  blocker: null
  source: arc/output.py:327

- path: reaction_upload.transition_state.calculations[].path_search_result.source_endpoint_count
  arc_location: "arc/job/adapters/ts/orca_neb.py:234"
  in_memory_form: "implicit: 2 for NEB/GSM (reactant and product side geometries, aligned via rxn.atom_map)"
  computed_when: "only for a NEB/GSM TS search"
  reachable_from_export: true
  export_effort: trivial
  effort_rationale: "Constant 2 emitted whenever the chosen method is a double-ended path search."
  blocker: null
  source: arc/job/adapters/ts/orca_neb.py:234

# ===========================================================================
# 4. WAVEFUNCTION AND SPIN DIAGNOSTICS  (arc/parser/)
# ===========================================================================

- path: species_upload.conformers[].primary_calculation.wavefunction_diagnostic.t1_diagnostic
  arc_location: "ARCSpecies.t1, assigned in arc/scheduler.py:2960 from parser.parse_t1(paths['sp'])"
  in_memory_form: "float, dimensionless (Lee-Taylor T1). None when the sp log reports none."
  computed_when: >-
    Whenever the single-point log carries a T1 line — i.e. coupled-cluster
    sp jobs. Parsers exist for gaussian, orca, molpro, psi4, cfour,
    terachem, xtb and the Arkane-YAML adapter.
  reachable_from_export: true
  export_effort: trivial
  effort_rationale: >-
    spc.t1 is already a populated attribute of every ARCSpecies at write
    time; _spc_to_dict does not mention it. One dict entry. This is the
    single largest value/effort ratio for the species workflow: T1 is the
    standard single-reference-quality gate and TCKDB has a first-class
    field for it.
  blocker: null
  source: arc/species/species.py:351

- path: reaction_upload.species[].conformers[].calculation.wavefunction_diagnostic.t1_diagnostic
  arc_location: "ARCSpecies.t1 (same attribute, reached through the reaction bundle)"
  in_memory_form: "float, dimensionless"
  computed_when: "same as the species_upload route"
  reachable_from_export: true
  export_effort: trivial
  effort_rationale: >-
