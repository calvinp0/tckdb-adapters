  obtained_from: computed
  value_kind: derived
  computed_when: always
  reachable_from_export: true
  export_effort: trivial
  effort_rationale: "enumerate(start=1) over r_species/p_species expanded by get_species_count at the write site."
  blocker: null
  reliability: high
  tckdb_value: high
  source: arc/reaction/reaction.py:872

