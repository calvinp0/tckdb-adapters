  reachable_from_export: true
  export_effort: trivial
  effort_rationale: >-
    _rxn_to_dict emits rxn.multiplicity but not rxn.charge
    (arc/output.py:1938). TCKDB carries charge per species and per TS but
    not per reaction, so this is arc_only; it is still a consistency check
    a loader would want.
  blocker: null
  source: arc/reaction/reaction.py:185

- path: arc_only.reaction.dh_rxn298
  arc_location: "ARCReaction.dh_rxn298, set by arc/statmech/arkane.py:267 set_reaction_dh_rxn"
  in_memory_form: "float, J/mol (note: J, not kJ — the neighbouring thermo fields are kJ/mol)"
  computed_when: "when the statmech adapter ran and both sides had thermo"
  reachable_from_export: true
  export_effort: trivial
  effort_rationale: >-
    Plain attribute on the in-scope reaction. The unit mismatch against
    every other energy in output.yml is the reason to convert explicitly
    on export rather than pass it through.
  blocker: null
  source: arc/reaction/reaction.py:121

- path: arc_only.reaction.rmg_kinetics
  arc_location: "ARCReaction.rmg_kinetics"
  in_memory_form: >-
    list[dict] with 'A' (cm-s-mol units), 'n', 'Ea' (kJ/mol) and 'comment'
