- path: species_upload.statmech.statmech_treatment
  arc_location: "arc/statmech/arkane.py:402 use_hindered_rotors=True if not skip_rotors else False"
  in_memory_form: >-
    bool (use_hindered_rotors) rendered into the Arkane input template, plus
    the per-rotor 'dimensions' in spc.rotors_dict. Together these decide
    TCKDB's enum: rrho when no rotors were used, rrho_1d when only 1D
    rotors, rrho_nd / rrho_1d_nd when any rotor has dimensions > 1.
  computed_when: "always when Arkane ran"
  reachable_from_export: true
  export_effort: moderate
  effort_rationale: >-
    rotors_dict is in scope so the 1D/ND part is derivable at write time,
    but the skip_rotors flag lives in the processor call and is not passed
    to write_output_yml. Either thread skip_rotors through (one extra
    parameter, same call site in arc/main.py) or derive it from whether any
    successful rotor exists — the latter conflates "no rotors found" with
    "rotors deliberately skipped".
  blocker: "skip_rotors is a process_arc_project argument, not a write_output_yml argument."
  source: arc/statmech/arkane.py:402

