  arc_location: "arc/statmech/arkane.py:85 (Arkane reaction() template block)"
  in_memory_form: >-
    Not represented. Statically true of ARC: the Arkane input template
    declares reactants/products/transitionState/tunneling and nothing else,
    so the fitted A never has a degeneracy factor folded in. The correct
    constant is therefore 'not_applied'.
  computed_when: "always when ARC's Arkane kinetics ran"
  reachable_from_export: true
  export_effort: trivial
  effort_rationale: >-
    A constant emitted next to the existing 'tunneling' key in the kinetics
    dict (arc/output.py:1930), which is already stamped by the same Arkane
    run. TCKDB defaults this field, and defaulting it wrongly silently
    rescales every rate a consumer derives.
  blocker: null
  source: arc/statmech/arkane.py:85

- path: arc_only.reaction.charge
  arc_location: "ARCReaction.charge property (get_rxn_charge)"
  in_memory_form: "int, net charge of the reaction PES, summed over r_species"
