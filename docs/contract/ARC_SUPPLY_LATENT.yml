  computed_when: "always when Arkane ran"
  reachable_from_export: true
  export_effort: moderate
  effort_rationale: >-
    Same skip_rotors plumbing as statmech_treatment; once that flag is in
    scope this is the same boolean. Worth stating explicitly because
    output.yml exports harmonic_frequencies_cm1 with no indication of
    whether the statmech treatment consumed them unprojected.
  blocker: "Same as statmech_treatment."
  source: arc/statmech/arkane.py:60

- path: species_upload.statmech.torsions[].top_description
  arc_location: "ARCSpecies.rotors_dict[i]['top']"
  in_memory_form: "list[int], 1-INDEXED (documented at arc/species/species.py:71) — the atoms of the rotating top"
  computed_when: "always for every rotor found by conformers.find_internal_rotors"
  reachable_from_export: true
  export_effort: trivial
  effort_rationale: >-
    _get_torsions already reads rotor['scan'] and rotor['pivots'] from the
