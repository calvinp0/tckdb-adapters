    simply not read. It is the only field that says WHICH side of the pivot
    rotates, which a reader cannot infer from the pivots alone.
  blocker: null
  source: arc/species/species.py:71

- path: species_upload.statmech.torsions[].torsion_index
  arc_location: "ARCSpecies.rotors_dict keys"
  in_memory_form: "int, 0-BASED dict key; TCKDB requires ge=1"
  computed_when: "always"
  reachable_from_export: true
  export_effort: trivial
  effort_rationale: >-
    _get_torsions iterates rotors_dict.items() and uses rotor_index only to
