  tckdb_value: high
  source: arc/scheduler.py:3445

# ===========================================================================
# 3. ENERGY-CORRECTION SWITCHES OUTSIDE THE THERMO BLOCK (e0, kinetics runs)
# ===========================================================================

- path: arc_only.species.statmech.e0_atom_corrections_applied
  arc_location: "arc/statmech/arkane.py:ArkaneAdapter.render_arkane_input_template:414 (use_aec) -> parse_species_thermo:1298 / parse_reaction_kinetics:1325 (spc.e0)"
  in_memory_form: >-
    Not stored. spc.e0 (float, kJ/mol) is written by whichever Arkane run parsed it last: the thermo run
    (AEC + BAC when bac_type set), the separate e0_only run (processor.py:221), or, for a TS, the kinetics
    run (AEC only; processor.py:154 passes bac_type=None). The use_aec/use_bac switch of that run is a
    local expression on main and an adapter attribute on PR #1059, never attached to spc.e0.
  obtained_from: computed
  value_kind: observed
  computed_when: every Arkane run; the switch is True iff Arkane's DB or ARC data/AEC.yml knows arkane_level_of_theory
  reachable_from_export: true
  export_effort: trivial
  effort_rationale: >-
    PR #1059 stamps the switch only on spc.thermo (so it covers e0 only for compute_thermo species, where
    thermo and e0 come from the same run). Stamp the same use_aec/use_bac onto the species when parse_e0
    assigns spc.e0 (both parse_species_thermo and parse_reaction_kinetics) and emit it beside
    statmech.e0_kj_mol. Alternatively recompute at write time: the switch is a pure function of
    arkane_level_of_theory, which write_output_yml already receives. Without it, statmech.e0_kj_mol of a
    TS or e0_only species cannot be told apart between a corrected 0 K enthalpy and an absolute
    electronic energy (~-1e5 kJ/mol per heavy atom).
  blocker: null
  reliability: high
  tckdb_value: high
  source: arc/statmech/arkane.py:414

- path: species_upload.thermo.enthalpy_formation_0k_kj_mol
  arc_location: "arc/output.py:_statmech_to_dict:2113 (statmech.e0_kj_mol)"
  in_memory_form: "float kJ/mol; Arkane conformer E0 = E_elec + AEC(+BAC) + scaled ZPE"
  obtained_from: arkane_output
  value_kind: derived
  computed_when: species with a converged Arkane statmech run whose useAtomCorrections was True
  reachable_from_export: true
  export_effort: trivial
  effort_rationale: >-
    The number is already exported as statmech.e0_kj_mol; what ARC does not export is the statement that
    it IS a 0 K formation enthalpy. That statement holds only when the producing run applied AEC (see the
    e0_atom_corrections_applied row) and the AEC level equals the energy level. For compute_thermo species
    the PR #1059 thermo flags come from the same Arkane run and suffice; for e0_only species and TSs they
    do not exist. Export effort is the marker, not the value.
  blocker: null
  reliability: medium
  tckdb_value: medium
  source: arc/output.py:2113

- path: arc_only.reaction.kinetics.atom_corrections_applied
  arc_location: "arc/statmech/arkane.py:render_arkane_input_template:414-415; arc/processor.py:154"
  in_memory_form: >-
    bool, not stored on the reaction. Kinetics run: useAtomCorrections = bool(model_chemistry or
    atom_energies); useBondCorrections is always False because processor passes bac_type=None to the
    kinetics adapter. Literal values also sit in calcs/statmech/kinetics/input.py.
  obtained_from: computed
  value_kind: observed
  computed_when: every rates run (compute_high_p_rate_coefficient)
  reachable_from_export: true
  export_effort: trivial
  effort_rationale: >-
    PR #1059 records the switches on thermo only; parse_arkane_kinetics_output / parse_reaction_kinetics
    record nothing. Stamp use_aec/use_bac into rxn.kinetics (and onto rxn.ts_species) in
    parse_reaction_kinetics and emit under kinetics. Matters for TCKDB because output.yml still emits
    atom_energy energy_corrections records for TS entries (the PR leaves TS flags null, so records are
    "emitted as before" whether or not the kinetics run applied them) and TS statmech.e0_kj_mol — i.e.
    reaction_upload.transition_state.applied_energy_corrections[] cannot be asserted as applied. Barrier
    (Ea) is unaffected when AEC is on/off uniformly (atom counts conserve), and BAC never enters a kinetics
    run, so the wells-vs-TS BAC non-cancellation risk does not arise on main.
  blocker: null
  reliability: high
  tckdb_value: high
  source: arc/processor.py:154

# ===========================================================================
# 4. ATOM MAPPING (arc/mapping/)
# ===========================================================================

- path: reaction_upload.atom_map.participants[].atom_to_ts
  arc_location: "arc/reaction/reaction.py:ARCReaction.atom_map:158 -> arc/mapping/driver.py:map_reaction:43"
  in_memory_form: >-
    list[int], 0-based, REACTANT->PRODUCT running-index permutation (entry i = product running
    index of reactant atom i), validated as a permutation by check_atom_map_and_return
    (arc/mapping/driver.py:132). TCKDB wants per-participant {local 1-based: TS 1-based}.
    Reactant leg = identity iff the TS geometry is in concatenated-reactant order; product leg =
    inverse of atom_map. ARC now checks the element sequence of the TS against the reactants
    (arc/checks/nmd.py:212 is_ts_atom_order_consistent_with_reactants) during NMD and records
    INCONSISTENT_ATOM_ORDER_WARNING in ts_checks['warnings'] on mismatch - a necessary, not
    sufficient, condition (same element order does not prove same atom identity).
  obtained_from: computed
  value_kind: derived
  computed_when: "lazily on first access once every reactant and product has an xyz; cached in _atom_map; None + logged error on failure"
  reachable_from_export: true
  export_effort: moderate
  effort_rationale: >-
    One attribute access in _rxn_to_dict (arc/output.py:2808). Moderate because of correctness:
    +1 on both sides, split running index into (participant, local index) using per-species atom
    counts expanded by get_species_count (arc/reaction/reaction.py:872) since remove_dup_species
    collapses A + A, and an explicit assertion that the TS geometry is in reactant order.
    Recommended: export raw 0-based map + per-participant atom counts (arc_only.reaction.atom_map)
    and let the adapter reshape.
  blocker: >-
    UNVERIFIED: that AutoTST / GCN / KinBot / GoFlow TS guesses preserve concatenated-reactant atom
    order; only the NMD element-sequence check guards it.
  reliability: medium
  tckdb_value: high
  source: arc/reaction/reaction.py:158

- path: reaction_upload.atom_map.participants[].participant_index
  arc_location: "arc/reaction/reaction.py:ARCReaction.r_species/p_species + get_species_count:872"
