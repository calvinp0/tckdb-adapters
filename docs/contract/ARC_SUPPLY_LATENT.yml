    field on ReactionFamily.
  blocker: "The RMG-vs-ARC-custom family provenance is discarded in read_groups_file_lines."
  source: arc/reaction/reaction.py:234

- path: reaction_upload.kinetics[].degeneracy
  arc_location: "not computed by ARC"
  in_memory_form: >-
    UNVERIFIED / absent. ARC does not compute reaction-path degeneracy. The
    only degeneracy handling in the tree is arc/scripts/rmg_kinetics.py:98,
    a helper that asks RMG for LIBRARY/ESTIMATED kinetics for comparison —
    it never touches the Arkane-fitted rate ARC reports.
  computed_when: "never"
  reachable_from_export: false
  export_effort: hard
  effort_rationale: >-
    Recorded as an explicit negative so the matrix does not read the gap as
    a plumbing problem. Supplying it would mean invoking RMG's family
    degeneracy machinery on the ARC reaction — new integration, not an
    export change.
  blocker: "ARC never computes it for its own kinetics."
  source: arc/scripts/rmg_kinetics.py:98

