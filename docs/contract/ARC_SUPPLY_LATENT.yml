  blocker: null
  source: arc/reaction/reaction.py:173

- path: arc_only.reaction.ts_xyz_guess
  arc_location: "ARCReaction.ts_xyz_guess"
  in_memory_form: "list of user-supplied TS xyz guesses (str or dict)"
  computed_when: "only when the user supplied TS guesses in the input"
  reachable_from_export: true
  export_effort: trivial
  effort_rationale: >-
    Live attribute. Distinguishes a saddle point ARC found on its own from
