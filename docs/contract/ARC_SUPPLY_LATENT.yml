  effort_rationale: >-
    rxn.family (a label str) is already exported; ReactionFamily(label) is
    process-cached (arc/family/family.py:135) so constructing it in
    _rxn_to_dict costs nothing after the first call. TCKDB defaults
    reversible to True, so an irreversible family currently uploads as
    reversible with no warning — a silent semantic error.
  blocker: null
  source: arc/family/family.py:159

- path: reaction_upload.reaction_family_source_note
  arc_location: "ARCReaction.determine_family / ARCReaction.family_own_reverse"
  in_memory_form: >-
    family_own_reverse: bool (arc/reaction/reaction.py:234), plus whether
