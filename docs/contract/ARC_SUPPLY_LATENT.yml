# ===========================================================================
# 7. REACTION-LEVEL FACTS  (arc/reaction/, arc/family/)
# ===========================================================================

- path: reaction_upload.reversible
  arc_location: "arc/family/family.py:159 ReactionFamily.reversible (from is_reversible)"
  in_memory_form: "bool, parsed from the RMG family groups.py 'reversible' declaration; defaults True when absent"
  computed_when: "always when rxn.family is not None"
