# repo: ARC (/home/calvin/code/ARC main db0934d5; "(PR #1059)" = open branch
#       feature_export_atom_corrections_applied a10e8ae0/1977e53b, read via git show)
#
# A3 — ARC latent supply, refreshed for tckdb-schemas 0.51.0. Fields ARC computes
# or can obtain but does NOT write to output.yml (schema 1.1 on main, 1.2 on PR #1059)
# or parser_evidence.json. Anything main or PR #1059 already exports is excluded;
# PR #1059 adds only thermo.atom_corrections_applied / bond_corrections_applied /
# atom_corrections_level and drops unapplied energy_corrections records.
#
# Paths: verbatim from the shared 0.51 walk (scratchpad/shared/paths_0_51.tsv).
# One representative route per concept (FIELD_KEY rule; ROUTE_ADJUDICATION decides
# generalisation). Keyed against the v2 walk (transport_upload now rooted at
# TransportUploadPayload; scheme.*_params descended). Transport rows use the
# dedicated transport_upload.* root; the same payload also embeds at
# conformer_upload.transport.*.
#
# Reachability baseline: arc/main.py:673 calls write_output_yml(species_dict=
# scheduler.species_dict, reactions=scheduler.rxn_list, output_dict=self.output,
# opt/freq/sp/neb levels, composite_method, freq_scale_factor, bac_type,
# compute_thermo, arkane_level_of_theory, irc_requested, t0). ARCSpecies /
# ARCReaction graphs and output_dict are live in arc/output.py; scheduler.job_dict
# (JobAdapters), adaptive_levels, scan/irc/conformer/ts_guess/orbitals levels, run
# settings and the ArkaneAdapter objects are NOT passed. Arkane's on-disk outputs
# under calcs/statmech/ normally still exist at write time (see the e0-only caveat).
#
# Columns beyond FIELD_KEY's A3 schema (all rows carry them):
#   obtained_from  parsed_log | computed | input_setting | scheduler_state |
#                  arkane_output | restart_yml | settings
#   value_kind     observed (read from what actually ran) | requested (an input
#                  or setting — never evidence of what ran) | derived (computed by ARC)
#   reliability    high | medium | low   (reliability_note on some rows)
#   tckdb_value    high | medium | low
# export_effort keeps FIELD_KEY's trivial | moderate | hard vocabulary because
# tools/join_inventories.py keys its cost column on it (trivial≈small,
# moderate≈medium, hard≈large).

# ===========================================================================
# 1. LEVELS OF THEORY PER CALCULATION (adaptive_levels, scan/irc/conformer levels)
# ===========================================================================

- path: species_upload.conformers[].primary_calculation.level_of_theory.method
  arc_location: "arc/scheduler.py:Scheduler.run_job:1123 -> determine_adaptive_level:5273"
  in_memory_form: >-
    Level object chosen per job from Scheduler.adaptive_levels ({(min_heavy, max_heavy|'inf'):
    {job_type_tuple: Level}}) keyed by spc.adaptive_lot_n_heavy (reaction-wide override set by
    _apply_adaptive_reaction_levels:5317) else spc.number_of_heavy_atoms. Lives only on the
    JobAdapter (job.level) and in the input deck; nothing per-species is stored.
  obtained_from: computed
  value_kind: derived
  computed_when: "every job when the run sets adaptive_levels; otherwise job.level == run-level opt/freq/sp level"
  reachable_from_export: false
  export_effort: moderate
  effort_rationale: >-
    output.yml exports only run-level opt_level/freq_level/sp_level (arc/output.py:176 ff.), so
    under adaptive_levels every species' calculation is attributed to the wrong level. Fix: pass
    self.adaptive_levels from main.py:673 into write_output_yml and, per species, re-run the
    same selection (determine_adaptive_level is a pure function of adaptive_levels, job_type and
    spc.adaptive_lot_n_heavy / number_of_heavy_atoms, both live on ARCSpecies) to emit
    per-species opt/freq/sp level dicts. Alternative, more faithful: record job.level.as_dict()
    per completed job on the species (needs a JobAdapter->species handoff). The actually-run
    method/basis is also recoverable from the exported opt_input/sp_input deck route line.
  blocker: >-
    adaptive_levels is not an argument of write_output_yml; the PR #1059 doc for
    atom_corrections_level explicitly states output.yml "records neither the adaptive levels
    nor a per-species energy level".
  reliability: high
  reliability_note: "deterministic recomputation of the scheduler's own selection; matches job.level unless the user later edited adaptive_levels between restarts"
  tckdb_value: high
  source: arc/scheduler.py:1123

- path: species_upload.statmech.energy_level_of_theory.method
  arc_location: "arc/scheduler.py:determine_adaptive_level:5273 (job_type 'sp' or 'composite')"
  in_memory_form: "Level (sp level for this species' heavy-atom range); same source as the primary_calculation row"
  obtained_from: computed
  value_kind: derived
  computed_when: "runs with adaptive_levels; without them it equals the exported run-level sp_level/composite_method"
  reachable_from_export: false
  export_effort: moderate
  effort_rationale: >-
    Same plumbing as the per-calculation level row (pass adaptive_levels, recompute per species).
    Scientifically load-bearing because Arkane is handed ONE arkane_level_of_theory and ONE
    freq_scale_factor for all species (no 'adaptive' reference anywhere in arc/processor.py,
    arc/statmech/arkane.py or arc/output.py), so a consumer needs the per-species energy level to
    detect a mismatch between the corrected level and the energy level.
    Statmech-side view (merged from the Arkane pass): the energy Arkane actually consumed is the
    log named in its species file, energy=Log(paths['composite'] or paths['sp'])
    (arc/statmech/arkane.py:483); binding that log to its job level is what lets a consumer
    compare it with thermo.atom_corrections_level (PR #1059), which the PR's own docs say is
    impossible today.
  blocker: "adaptive_levels not passed to write_output_yml; per-job level lives on JobAdapters"
  reliability: high
  tckdb_value: high
  source: arc/scheduler.py:5273

- path: species_upload.thermo.energy_level_of_theory.method
  arc_location: "arc/scheduler.py:determine_adaptive_level:5273"
  in_memory_form: "Level; identical value to statmech.energy_level_of_theory for the same species"
  obtained_from: computed
  value_kind: derived
  computed_when: "runs with adaptive_levels"
  reachable_from_export: false
  export_effort: moderate
  effort_rationale: "Same single change as statmech.energy_level_of_theory; one per-species field feeds both TCKDB paths."
  blocker: "adaptive_levels not passed to write_output_yml"
  reliability: high
  tckdb_value: high
  source: arc/scheduler.py:5289

- path: arc_only.species.opt_level
