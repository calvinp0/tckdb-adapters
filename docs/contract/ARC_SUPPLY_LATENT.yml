  source: arc/reaction/reaction.py:110

- path: arc_only.reaction.product_dicts
  arc_location: "ARCReaction.product_dicts -> arc/family/family.py:505 get_reaction_family_products"
  in_memory_form: >-
    list[dict], each carrying the family-generated product molecules and
