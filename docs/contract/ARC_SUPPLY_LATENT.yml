- path: reaction_upload.atom_map.equivalent_map_count
  arc_location: "arc/reaction/reaction.py:ARCReaction.atom_map_clusters:175 -> arc/mapping/cluster.py:map_reaction_clusters:1028 (MapCluster:98)"
  in_memory_form: >-
    list[MapCluster]; each has members (enumerated equivalent maps), degeneracy (exact reaction-path
    degeneracy of the center, center_degeneracy), enumerated_degeneracy, truncated, recipe_validated.
    len(members) of the cluster containing rxn.atom_map is an enumeration-bounded count of
    symmetry-equivalent maps (MAX_ENUMERATED_MAPS=5000, and only RMG template matches are enumerated).
  obtained_from: computed
