# ─────────────────────────────────────────────────────────────────────────────

- path: species_upload.conformers[].primary_calculation.level_of_theory.method
  arc_key: "output.yml: opt_level.method (also freq_level/sp_level/composite_method)"
  availability: conditional
  condition: >-
    Null when the caller passes no opt_level. A composite run carries the method
    on `composite_method` and leaves opt/freq/sp null.
  fidelity: exact
  fidelity_note: >-
    Free string, ARC's own casing (e.g. 'wb97xd'). TCKDB requires method
    min_length 1, so a run with a null level cannot produce a valid calculation.
  fixture_evidence: arc/output_schema_test.py:646
  source: arc/output.py:128

