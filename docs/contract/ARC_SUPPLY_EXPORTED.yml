  fidelity: exact
  fidelity_note: >-
    Full level_dict leaf mapping as above. This is the level of the NEB TS
    search, so it belongs on the TS's path_search calculation.
  fixture_evidence: arc/output_schema_test.py:522
  source: arc/output.py:131

- path: arc_only.output_yml.composite_method
  arc_key: "output.yml: composite_method"
  availability: conditional
  condition: "Non-null only for composite runs (CBS-QB3, G4). Null in every committed fixture."
  fidelity: exact
  fidelity_note: >-
    A level_dict. TCKDB has no composite-method concept distinct from
    level_of_theory; the composite method name must be pushed into
    `level_of_theory.method` on every calculation, which loses the distinction
    between "this calc ran at CBS-QB3" and "the run's composite method is CBS-QB3".
  fixture_evidence: arc/output_schema_test.py:505
  source: arc/output.py:127

- path: species_upload.applied_energy_corrections[].scheme.level_of_theory.method
  arc_key: "output.yml: arkane_level_of_theory.method"
  availability: conditional
