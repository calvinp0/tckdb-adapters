  fidelity: derived
  fidelity_note: >-
    INDEX-BASE AND UNIQUENESS HAZARD. ARC emits Gaussian's own per-branch
    `Point Number`, which starts at 1 (point 0 is the TS seed and has no
    structure block, so it is never emitted) — the golden's first forward point
    is source_point_index 1, and the reverse branch ALSO starts at 1
