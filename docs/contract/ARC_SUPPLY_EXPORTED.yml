- path: species_upload.conformers[].additional_calculations[].level_of_theory.method
  arc_key: "output.yml: freq_level.method / sp_level.method"
  availability: conditional
  condition: "Null when the caller passes no freq_level/sp_level; the runtime then falls back to opt_level."
  fidelity: exact
  fidelity_note: >-
    Whole-run levels, not per-calculation. output.yml carries ONE freq_level and
