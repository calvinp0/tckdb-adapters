# repo: ARC  (/home/calvin/code/ARC)
# A2 - ARC exported supply, refreshed for tckdb-schemas 0.51.0.
#
# Inventoried ARC state:
#   main @ db0934d5  (output.yml schema 1.1)
#   branch feature_export_atom_corrections_applied @ 1977e53b (ARC PR #1059, schema 1.2)
# Rows that exist only on the 1.2 branch carry condition "ARC PR #1059 (schema 1.2) ..." and cite
# the branch as `feature_export_atom_corrections_applied:<path>:<line>` (git show <branch>:<path>).
#
# Export surface:
#   output/output.yml             - result contract (arc/output.py)
#   output/parser_evidence.json   - parser-evidence sidecar (arc/parser_evidence.py)
#
# KEYING (see ARC_SUPPLY_EXPORTED.md):
#   * per-species leaves: species_upload.* and conformer_upload.* (the two species-shaped
#     upload roots). The reaction_upload.species[].* mirror is NOT duplicated.
#   * TS leaves: reaction_upload.transition_state.* AND ts_upload.* (both are real TS homes
#     at 0.51; reaction_upload.transition_state has no conformers[] any more).
#   * reaction / kinetics leaves: reaction_upload.*
#   * transport_upload: no rows - ARC exports no transport data (see .md).
#   * calculation routing: opt -> primary_calculation / calculation / primary_opt;
#     freq, sp, scan, irc, path_search -> additional_calculations[] / calculations[].
#   * A row exists ONLY where ARC exports a value (or a value derivable from exported
#     keys). TCKDB fields ARC does not export have NO row here: the join treats any A2
#     row as supply, so a placeholder row would hide an ARC_ABSENT gap.
#
# fixture_evidence classes (strongest first):
#   arc/testing/parser_evidence/golden/*   committed golden fixture (thin: 18-line output.yml)
#   arc/output_schema_test.py:N            document built by the REAL writer, schema-validated
#   arc/output_test.py:N                   unit assertion on the emitted value
#   other ARC test path                    upstream producer test only
#   tckdb-adapters:<path>:N                hand-written adapter fixture (not ARC-generated)
#   null                                   no committed test or fixture exercises it

