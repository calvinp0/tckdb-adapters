# repo: ARC.worktrees/feature_arc_result_export_contract
# A2 — ARC exported supply. What ARC writes out today for a downstream database.
# Two artefacts make up the export surface:
#   output/output.yml          — the tool-neutral result contract (arc/output.py)
#   output/tckdb_evidence.json — the versioned parser-evidence sidecar (arc/tckdb_evidence.py)
#
# ROUTING RULE (see ARC_SUPPLY_EXPORTED.md "Keying"): per-species leaves are keyed
# under `species_upload.*`. TCKDB mirrors the same species shape at
# `reaction_upload.species[].*`, and the identical ARC value populates it; those
# mirror paths are NOT duplicated here. TS leaves are keyed under
# `reaction_upload.transition_state.*` (there is no species_upload home for a TS).
# Reaction/kinetics leaves are keyed under `reaction_upload.*`.
# Calculation routing: opt -> conformers[].primary_calculation;
# freq / sp / scan / irc / path_search -> conformers[].additional_calculations[]
# (species) or transition_state.calculations[] (TS).
#
# `fixture_evidence` citation classes:
#   arc/testing/tckdb_evidence/golden/*  — committed golden fixture (strongest)
#   arc/output_schema_test.py:*          — document built by the REAL writer and
#                                          validated against the JSON schema
#   arc/output_test.py:*                 — unit-level assertion on the emitted value
#   null                                 — no test exercises this export path at all

# ─────────────────────────────────────────────────────────────────────────────
# output.yml — document header and run-level provenance
# ─────────────────────────────────────────────────────────────────────────────

- path: arc_only.output_yml.schema_version
  arc_key: "output.yml: schema_version"
  availability: always
  condition: null
  fidelity: exact
  fidelity_note: >-
    Contract version of output.yml itself ("1.1"). TCKDB has no field for a
    producer-side document version; it is the gate a consumer must read before
    trusting any other path in this inventory.
  fixture_evidence: arc/testing/tckdb_evidence/golden/output.yml:1
  source: arc/output.py:115

- path: arc_only.output_yml.project
  arc_key: "output.yml: project"
  availability: always
  condition: null
  fidelity: exact
  fidelity_note: "ARC project name. No TCKDB home; TCKDB has no run/project entity."
  fixture_evidence: arc/output_test.py:1335
  source: arc/output.py:117

- path: species_upload.workflow_tool_release.name
  arc_key: "tckdb_evidence.json: producer.name"
  availability: always
  condition: null
  fidelity: exact
  fidelity_note: >-
    Literal "ARC". Not present in output.yml at all — only the evidence sidecar
    names the producer. A consumer reading output.yml alone must hardcode it.
  fixture_evidence: arc/testing/tckdb_evidence/golden/tckdb_evidence.json:6
  source: arc/tckdb_evidence.py:651

- path: species_upload.workflow_tool_release.version
  arc_key: "output.yml: arc_version; tckdb_evidence.json: producer.version"
  availability: always
  condition: null
  fidelity: exact
  fidelity_note: "ARC's VERSION constant, e.g. '1.1.0'."
  fixture_evidence: arc/testing/tckdb_evidence/golden/output.yml:2
