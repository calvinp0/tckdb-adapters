- path: reaction_upload.transition_state.calculations[].path_search_result.points[].path_coordinate
  arc_key: "tckdb_evidence.json: ...gsm...points[].cumulative_com_superposed_displacement_angstrom"
  availability: conditional
  condition: >-
    KEY OMITTED when there are fewer than two frames or any kabsch call fails.
    Zero at the first frame by construction.
  fidelity: lossy
  fidelity_note: >-
    UNIT Angstrom, stated in the ARC field name; TCKDB's `path_coordinate` has
    NO unit and no definition, so both are lost. The quantity is the running sum
    of the Frobenius norm of the coordinate difference after each consecutive
    pair is translated to its CENTRE OF MASS and optimally rotated — i.e.
    sqrt(N_atoms) times the RMSD, unweighted, but with a mass-dependent
    superposition frame, so it MOVES UNDER ISOTOPIC SUBSTITUTION and is an upper
    bound on the freely superposed displacement (6% high on the golden's final
    point). It shares NEITHER units, sign convention, NOR origin with the IRC
    record's reaction_coordinate_sqrt_amu_bohr, yet both land in adjacent TCKDB
    fields with no unit. The rename from `path_coordinate_angstrom` in
    arc-gsm-stringfile-2 exists precisely to stop that conflation.
  fixture_evidence: arc/testing/tckdb_evidence/golden/tckdb_evidence.json:107
  source: arc/tckdb_evidence.py:587

