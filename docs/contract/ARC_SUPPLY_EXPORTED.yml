  fidelity: derived
  fidelity_note: >-
    Two competing sources with different formats: `ess_versions.opt` is the raw
    banner string ('Gaussian 16, Revision C.01' / 'ORCA 5.0.4'), which contains
    the software NAME as well as the version. TCKDB `version` is a bare version
