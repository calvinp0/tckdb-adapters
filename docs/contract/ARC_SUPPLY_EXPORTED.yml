    applies identically here.
  fixture_evidence: arc/output_schema_test.py:494
  source: arc/output.py:129

- path: species_upload.conformers[].additional_calculations[].software_release.name
  arc_key: "output.yml: freq_level.software / sp_level.software"
  availability: conditional
  condition: "Null when the level is null; the writer falls back to opt's software for the deck-name lookup only."
  fidelity: exact
  fidelity_note: null
  fixture_evidence: arc/output_schema_test.py:495
  source: arc/output.py:149

- path: reaction_upload.transition_state.calculations[].level_of_theory.method
  arc_key: "output.yml: neb_level.method"
  availability: conditional
  condition: >-
    The `neb_level` KEY IS OMITTED ENTIRELY when neb_level is None (the only
    top-level key in output.yml that is omitted rather than nulled). Present
