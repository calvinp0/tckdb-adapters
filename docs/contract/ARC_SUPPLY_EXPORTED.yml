    None otherwise. Arkane lives in RMG-Py, so this is the RMG-Py HEAD hash.
  fidelity: derived
  fidelity_note: >-
    ARC exports a git commit hash; TCKDB's SoftwareReleaseRef has no git_commit
    field, so it must land in `revision` (free string). It is RMG-Py's HEAD, not
    an Arkane release version — TCKDB's `version` stays unsupplied.
  fixture_evidence: arc/output_test.py:169
  source: arc/output.py:250

