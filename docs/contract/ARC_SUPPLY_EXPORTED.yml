- path: species_upload.applied_energy_corrections[].scheme.kind
  arc_key: "output.yml: bac_type"
  availability: conditional
  condition: "'p', 'm', or null. Null when no BAC was requested."
  fidelity: derived
  fidelity_note: >-
    ARC's one-letter code maps to TCKDB's enum: 'p' -> bac_petersson,
    'm' -> bac_melius. The atom-energy correction's scheme kind (atom_energy) is
    not encoded in bac_type at all; it is implied by
    energy_corrections[].correction_type.
  fixture_evidence: arc/output_schema_test.py:499
  source: arc/output.py:139

- path: species_upload.applied_energy_corrections[].scheme.atom_params[].element
  arc_key: "output.yml: atom_energy_corrections (keys)"
  availability: conditional
  condition: >-
    Requires a matched Arkane AEC key AND a successful subprocess call into the
    RMG conda environment (arc/scripts/get_qm_corrections.py). Null on any failure.
  fidelity: exact
  fidelity_note: "Element symbol, e.g. 'C'."
  fixture_evidence: arc/output_schema_test.py:710
  source: arc/output.py:141

- path: species_upload.applied_energy_corrections[].scheme.atom_params[].value
  arc_key: "output.yml: atom_energy_corrections (values)"
  availability: conditional
  condition: "Same gate as atom_params[].element."
  fidelity: lossy
  fidelity_note: >-
    UNIT: hartree. CRITICAL SEMANTIC TRAP — these are NOT per-atom corrections.
    They are Arkane's bare atomic electronic energies, SUBTRACTED as a reference
    (arc/output.py:891-899 says so explicitly and names the failure: reconstructing
    the correction as sum(count*value) is wrong in both sign and ~1e5 kJ/mol in
    magnitude). TCKDB's SchemeAtomParamPayload carries no `applied_as` flag, so
    the sign convention is destroyed at the scheme level. The `applied_as` fact
    survives only on energy_corrections[].reference_atom_energies.
  fixture_evidence: arc/output_schema_test.py:710
  source: arc/output.py:141

- path: species_upload.applied_energy_corrections[].scheme.bond_params[].bond_key
  arc_key: "output.yml: bond_additivity_corrections (keys, Petersson)"
  availability: conditional
  condition: "bac_type == 'p' AND a matched Arkane BAC key AND the RMG subprocess succeeded."
  fidelity: exact
  fidelity_note: "Bond key string, e.g. 'C-H'."
  fixture_evidence: arc/output_test.py:1472
  source: arc/output.py:142

- path: species_upload.applied_energy_corrections[].scheme.bond_params[].value
  arc_key: "output.yml: bond_additivity_corrections (values, Petersson)"
  availability: conditional
  condition: "bac_type == 'p'; same gate as bond_key."
  fidelity: derived
  fidelity_note: >-
    UNIT MISMATCH RISK: kcal/mol, ARC's own docs record that an earlier revision
    of arc/docs/output_yml_schema.md wrongly said kJ/mol (docs/output_yml_schema.md:258).
    TCKDB's SchemeBondParamPayload.value carries no unit; the unit lives on
    EnergyCorrectionSchemeRef.units, which must be set to `kcal_mol`.
  fixture_evidence: arc/output_test.py:1472
  source: arc/output.py:142

- path: species_upload.applied_energy_corrections[].scheme.component_params[].component_kind
  arc_key: "output.yml: bond_additivity_corrections (Melius nesting level 1)"
  availability: conditional
  condition: "bac_type == 'm' only."
  fidelity: derived
  fidelity_note: >-
    ARC emits Arkane's nested Melius structure verbatim:
    {atom_corr:{el:v}, bond_corr_length:{el:v}, bond_corr_neighbor:{el:v},
    mol_corr:float}. TCKDB flattens this to a list of
    (component_kind, key, value) triples. `mol_corr` is a bare float in ARC and
    must be given a synthetic `key` to fit TCKDB's shape.
  fixture_evidence: arc/output_schema_test.py:702
  source: arc/output.py:142

- path: species_upload.applied_energy_corrections[].scheme.component_params[].value
  arc_key: "output.yml: bond_additivity_corrections (Melius leaf values)"
  availability: conditional
  condition: "bac_type == 'm' only."
  fidelity: derived
  fidelity_note: "kcal/mol; same unit-carrying problem as bond_params[].value."
  fixture_evidence: arc/output_schema_test.py:702
  source: arc/output.py:142

- path: species_upload.applied_energy_corrections[].scheme.units
  arc_key: null
  availability: rare
  condition: >-
    Never exported at the scheme level. ARC states the unit per correction record
    (energy_corrections[].total.unit) but the run-level parameter tables
    atom_energy_corrections / bond_additivity_corrections carry no unit key.
  fidelity: lossy
  fidelity_note: >-
    The consumer must hardcode hartree for the AEC table and kcal/mol for the BAC
    table. This is the single most dangerous unit gap in the header block.
