- concept: additional_calculations[].irc_result.direction
  affected_rows: 1
  verdict: GENERALISES
  rationale: 'One parent-agnostic builder, _build_irc_result_payload (tckdb_arc/tckdb_arc/adapter.py:5823),
    produces this block, and every one of the six calculation routes reaches the identical payload
    class — TCKDB declares irc_result / path_search_result on both CalculationInBundle (computed_species_upload.py:130-194)
    and ComputedReactionCalculationIn (computed_reaction_upload.py:111-130), and A4 records that
    the reaction-path flattening rewrites only opt_result / freq_result / sp_result, leaving these
    nested. Noted, and deliberately NOT treated as a gap: the adapter invokes these builders only
    on the transition-state path (tckdb_arc/tckdb_arc/adapter.py:2729 for IRC, tckdb_arc/tckdb_arc/adapter.py:2542
    for path search), so the species-conformer demand routes are never populated. That is vacuous
    demand, not an ARC deficiency — an IRC or a double-ended path search on a non-saddle conformer
    is not an object ARC or anyone produces. TCKDB exposes the field there only because its calculation
    model is uniform across calc types. Do not re-verdict the species routes as ARC_ABSENT.'
  evidence: tckdb_arc/tckdb_arc/adapter.py:5823
  exceptions: []
