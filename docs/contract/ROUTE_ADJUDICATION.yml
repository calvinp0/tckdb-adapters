    (TS block). The value here comes from _spin_diagnostic_payload (tckdb_arc/tckdb_arc/adapter.py:4323),
    which takes the ARC record and the calc role and knows nothing about the parent. A4 records
    that the reaction-path rewrite (_flatten_all_reaction_calcs, tckdb_arc/tckdb_arc/adapter.py:5453)
    unwraps only opt_result / freq_result / sp_result, so this block keeps one spelling on every
    route.
