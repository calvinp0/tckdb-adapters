- kind: route_applicability
  rule_id: AP-11-freq-sp-evidence-on-opt-primary
  pattern: '^(species_upload\.conformers\[\]\.primary_calculation|reaction_upload\.species\[\]\.conformers\[\]\.calculation|reaction_upload\.transition_state\.calculation|ts_upload\.primary_opt|conformer_upload\.calculation)\.(hessian|spin_diagnostic|level_of_theory\.spin_treatment)(\.|$)'
  verdict: DIFFERENT_INSTANCE
  rationale: 'ARC''s Hessian comes from the freq log (parser_evidence freq_hessian), its S^2 from the
    sp job, and its spin treatment from scf_reference.{freq,sp}_reference, observed on those
    inputs. None of them describes the geometry optimisation that is the primary calculation, and
    the adapter deliberately does not propagate the freq/sp reference to the opt
    (adapter.py:3416-3418). The 0.22 calculation-route mirroring ruling (§1.1) generalised these
    across routes by tail; on the primary-opt routes that borrowed a freq/sp fact for the opt.'
  evidence: tckdb_arc/tckdb_arc/adapter.py:3416
- kind: route_mirror
  rule_id: RM-1-reaction-species-blocks
  pattern: '^reaction_upload\.species\[\]\.(thermo|statmech|species_entry|applied_energy_corrections\[\])\.'
  replacement: 'species_upload.\1.'
  verdict: GENERALISES
  rationale: 'The species mirror of §1.2, made mechanical. A2 keys per-species leaves under
    species_upload only and states the identical ARC value populates reaction_upload.species[];
    the adapter reads the same output.yml species[] record for both
    (_build_computed_species_payload and _build_reaction_species_block). At 0.22 only the rows
    nobody mapped were adjudicated, so the reaction mirror rows the adapter DOES map stayed
    SOURCE_UNCONFIRMED although their supply was inventoried one route over. BundleThermoIn and
    BundleStatmechIn are subsets of the species-root models, so a mirror path always exists on the
    species root.'
  evidence: tckdb_arc/tckdb_arc/adapter.py:2205
- kind: route_mirror
  rule_id: RM-2-reaction-species-primary-calc
  pattern: '^reaction_upload\.species\[\]\.conformers\[\]\.calculation\.'
  replacement: 'species_upload.conformers[].primary_calculation.'
  verdict: GENERALISES
  rationale: As RM-1; the reaction conformer's calculation is the species conformer's primary opt.
  evidence: tckdb_arc/tckdb_arc/adapter.py:2205
- kind: route_mirror
  rule_id: RM-3-reaction-species-calcs
