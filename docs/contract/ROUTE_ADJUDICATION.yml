    a path A1 does not have, because the reaction-root calculation model is flat (ComputedReactionCalculationIn
    exposes freq_imaginary_dispositions, not freq_result.modes[]). So the join matched against
    a mis-keyed path. (2) The latent capability A3 cites, arc/checks/ts.py, assesses imaginary
    modes on a TRANSITION STATE. The two demand routes here are a species conformer''s primary/additional
    calculation — a minimum. ARC has no code that assigns a disposition to a spurious imaginary
    mode on a minimum. Re-verdict both rows ARC_ABSENT.'
