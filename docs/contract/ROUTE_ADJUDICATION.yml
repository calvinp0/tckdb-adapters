- concept: software_release.name
  affected_rows: 8
  verdict: DIFFERENT_INSTANCE
  rationale: None of these routes is the calculation's own software_release. Six are execution_environment.software_release,
    which is ScientificSoftwareReleaseIdentity (fragments/execution_environment.py:208) nested
    inside ExecutionEnvironmentManifestPayload (:253) — a DIFFERENT class from the top-level SoftwareReleaseRef
    the sibling supplies, and one that cannot be sent without also sending the manifest's required
    schema_version, runtime (a discriminated union of container / conda / HPC-module / described)
    and executable. The string 'execution_environment' does not occur anywhere in tckdb_arc, and
    A2 records the whole execution environment as structurally absent from ARC's export. The remaining
    two, species_upload.statmech.software_release and species_upload.thermo.software_release,
    name the ANALYSIS software that produced the statmech/thermo block (Arkane), not the ESS that
    ran a calculation; ARC exports only arkane_git_commit for that, with no version string (_arc_analysis_software_release,
    tckdb_arc/tckdb_arc/adapter.py:4858). Re-verdict ARC_ABSENT.
  evidence: tckdb_arc/tckdb_arc/adapter.py:3236
  exceptions: []
- concept: constraints[].atom1_index
  affected_rows: 6
  verdict: GENERALISES
  rationale: 'All six demand routes are scan_result.constraints[], and TCKDB uses one element
    class, CalculationConstraintCreate (fragments/calculation.py:93), for both a calculation''s
    top-level constraints and the constraints inside scan_result. The adapter has one serializer,
    _serialize_calc_constraints (tckdb_arc/tckdb_arc/adapter.py:74) delegating to constraints.py:202,
    and ARC supplies rotor-scan constraints as rotor_scans[].constraints[] (ARC:arc/output.py:1575)
    from the same parser that supplies opt_constraints. ADAPTER-ROUTING FINDING to carry forward:
