# Phase B refresh for tckdb-schemas 0.51.0 (TCKDB_v2 ad3cd706). New row kinds.
# See ROUTE_ADJUDICATION.md §7. The concept rulings above were written against
# the 0.22 path set and still apply by concept tail; the rows below (a) stop
# them leaking onto the three new roots, (b) relate the reaction bundle's
# flattened result scalars to the nested result blocks, and (c) record
# adapter mappings Phase B found reading a key ARC does not write.
#
#   kind: route_applicability  -- regex `pattern` over the demand path; applies
#       only when no inventory supplies the row at its own path (no A2, A3 or
#       A4 row). verdict VACUOUS -> NOT_APPLICABLE; DIFFERENT_INSTANCE or GATED
#       -> ARC_ABSENT without borrowing any sibling's supply.
#   kind: flattened_alias      -- a ComputedReactionCalculationIn scalar and the
#       nested result tail it flattens; supply is looked up at the nested tail.
#   kind: mapping_review       -- the adapter emits the field but reads an ARC
#       key that A2 shows ARC does not write there; `verdict_override` replaces
#       the join verdict.
# ============================================================================
- kind: route_applicability
  rule_id: AP-1-result-block-on-opt-primary
  pattern: '^(species_upload\.conformers\[\]\.primary_calculation|reaction_upload\.species\[\]\.conformers\[\]\.calculation|reaction_upload\.transition_state\.calculation|ts_upload\.primary_opt|conformer_upload\.calculation)\.(freq_result|sp_result|irc_result|path_search_result|scan_result|freq_|sp_)'
  verdict: VACUOUS
  rationale: 'These four routes are the primary calculation of a conformer or TS, and TCKDB
    requires that calculation to be type opt (computed_species_upload.py:327,
    computed_reaction_upload.py:281 and :939, transition_state_upload.py:166-167). A typed
    calculation admits only the result block matching its type (computed_species_upload.py:208-240,
    fragments/calculation.py:883 CalculationWithResultsPayload). A freq/sp/irc/path-search/scan result
    on an opt calculation is therefore refused or meaningless. On the reaction route the
    flattened freq_*/sp_* scalars are not refused by a type matrix, but ARC runs freq and sp as
    separate jobs and the adapter deposits them as separate calculations, so no ARC object
    populates them on the opt. The old concept rulings generalised these rows from additional
    calculations; that was a route-shape artefact, not supply. conformer_upload.calculation is not
    forced to type opt by the schema, but it is the calculation that produced the conformer
    geometry and the adapter''s conformer mode always sends the opt there (freq and sp go to
    additional_calculations[], which are supplied), so for ARC these legs are vacuous too.'
  evidence: TCKDB:schemas/python/tckdb-schemas/tckdb_schemas/workflows/computed_species_upload.py:327
- kind: route_applicability
  rule_id: AP-2-irc-path-search-on-minimum
  pattern: '^(species_upload|conformer_upload|transport_upload|reaction_upload\.species\[\])\..*\.(irc_result|path_search_result)(\.|$)'
  verdict: VACUOUS
  rationale: 'An IRC or a double-ended path search is run from a saddle point. On a minimum''s
    calculation routes TCKDB exposes the field only because its calculation model is uniform
    across calculation types. This supersedes the 0.22 ruling in §1.5 of ROUTE_ADJUDICATION.md,
    which reached the same conclusion (not a gap) but encoded it as GENERALISES, so the matrix
    showed these rows as WIRED although the adapter never emits them there
    (_build_irc_result_payload and _build_path_search_result_payload are called only inside the
    TS block). NOT_APPLICABLE says what §1.5 meant.'
  evidence: tckdb_arc/tckdb_arc/adapter.py:2542
- kind: route_applicability
  rule_id: AP-3-ts-designation-on-minimum
  pattern: '^(species_upload|conformer_upload|transport_upload|reaction_upload\.species\[\])\..*\.(reaction_coordinate_mode_index|freq_reaction_coordinate_mode_index)$'
  verdict: VACUOUS
  rationale: 'reaction_coordinate_mode_index designates the reaction-coordinate mode of a saddle
    point. The schema says it is "meaningless on a minimum, and refused there"
    (fragments/calculation.py:257-269, validator :323-357).'
  evidence: TCKDB:schemas/python/tckdb-schemas/tckdb_schemas/fragments/calculation.py:262
- kind: route_applicability
  rule_id: AP-4-transport-gated
  pattern: '^(transport_upload\.|conformer_upload\.transport\.)'
  verdict: GATED
  rationale: 'Every transport route is gated on ARC producing transport data, which it does not:
    arc/output.py has no transport code (A2), the processor''s transport step is a todo
    (ARC:arc/processor.py:237) and no onedmin job adapter is registered (A3), and the adapter has
    no transport builder (A4 §7). The provenance and calculation sub-blocks of a transport upload
    (software_release, workflow_tool_release, calculations[], species_entry) are supplied at
    other routes, but borrowing them here would describe a record nobody can deposit. Rows with
    their own A3 latent supply (dipole, polarizability, sigma, epsilon) keep ARC_LATENT.'
  evidence: ARC:arc/processor.py:237
- kind: route_applicability
  rule_id: AP-5-execution-environment
  pattern: '\.execution_environment(\.|\{|$)'
  verdict: DIFFERENT_INSTANCE
  rationale: 'Extends the 0.22 ruling (§2.2) to the new roots. ExecutionEnvironmentManifestPayload
    nests narrower release identities and requires schema_version, a discriminated runtime and an
    executable; no ARC export or adapter builder produces any of it. A calculation''s own
    software_release / workflow_tool_release is a different object. The 0.22 PARTIAL rulings on
    workflow_tool_release.* and software_release.* enumerated only the 0.22 routes as exceptions,
    so without this rule the conformer_upload / ts_upload / transport_upload execution-environment
    routes were wrongly generalised.'
  evidence: TCKDB:schemas/python/tckdb-schemas/tckdb_schemas/fragments/execution_environment.py:253
- kind: route_applicability
  rule_id: AP-6-aec-frequency-scale-factor
  pattern: '\.applied_energy_corrections\[\]\.frequency_scale_factor(\.|$)'
  verdict: DIFFERENT_INSTANCE
  rationale: 'Extends the 0.22 ruling (§2.1) to conformer_upload. ARC never attaches a scale factor
    to a correction record (its energy_correction $def is additionalProperties:false) and the
    adapter never emits the block; statmech.freq_scale_factor is a different field.'
  evidence: ARC:arc/output.py:1532
- kind: route_applicability
  rule_id: AP-7-ts-rotor-scan
  pattern: '^(reaction_upload\.transition_state|ts_upload)\..*\.scan_result(\.|$)'
  verdict: DIFFERENT_INSTANCE
  rationale: 'Extends the 0.22 ruling (§2.4). ARC''s transition_states[] record carries no
    rotor_scans, and ts_upload has no scan slot at 0.51. Where the adapter does emit a scan on the
    reaction TS route (A4 rows exist) this rule does not apply.'
  evidence: tckdb_arc/tckdb_arc/adapter.py:3079
- kind: flattened_alias
  flat_field: sp_electronic_energy_hartree
  nested_tail: sp_result.electronic_energy_hartree
  verdict: GENERALISES
  rationale: 'ComputedReactionCalculationIn inherits CalculationIn''s flattened result scalars
    (fragments/calculation.py CalculationIn; reaction validator computed_reaction_upload.py:178-197
    names them) instead of the typed opt_result / freq_result / sp_result blocks the species,
    conformer and TS roots use. The adapter builds the nested blocks once and unwraps them for
    the reaction root (_flatten_all_reaction_calcs), and A2 keys the TS supply on both spellings.
    The ARC value is the same record field, so supply at the nested tail covers the flat field.'
  evidence: TCKDB:schemas/python/tckdb-schemas/tckdb_schemas/workflows/computed_reaction_upload.py:178
- kind: flattened_alias
  flat_field: opt_converged
  nested_tail: opt_result.converged
  verdict: GENERALISES
  rationale: Same flattening as sp_electronic_energy_hartree.
  evidence: TCKDB:schemas/python/tckdb-schemas/tckdb_schemas/workflows/computed_reaction_upload.py:178
- kind: flattened_alias
  flat_field: opt_n_steps
  nested_tail: opt_result.n_steps
  verdict: GENERALISES
  rationale: Same flattening as sp_electronic_energy_hartree.
  evidence: TCKDB:schemas/python/tckdb-schemas/tckdb_schemas/workflows/computed_reaction_upload.py:178
- kind: flattened_alias
  flat_field: opt_final_energy_hartree
  nested_tail: opt_result.final_energy_hartree
  verdict: GENERALISES
  rationale: Same flattening as sp_electronic_energy_hartree.
  evidence: TCKDB:schemas/python/tckdb-schemas/tckdb_schemas/workflows/computed_reaction_upload.py:178
- kind: flattened_alias
  flat_field: freq_n_imag
  nested_tail: freq_result.n_imag
  verdict: GENERALISES
  rationale: Same flattening as sp_electronic_energy_hartree.
  evidence: TCKDB:schemas/python/tckdb-schemas/tckdb_schemas/workflows/computed_reaction_upload.py:178
- kind: flattened_alias
  flat_field: freq_imag_freq_cm1
  nested_tail: freq_result.imag_freq_cm1
  verdict: GENERALISES
  rationale: Same flattening as sp_electronic_energy_hartree.
  evidence: TCKDB:schemas/python/tckdb-schemas/tckdb_schemas/workflows/computed_reaction_upload.py:178
- kind: flattened_alias
  flat_field: freq_zpe_hartree
  nested_tail: freq_result.zpe_hartree
  verdict: GENERALISES
  rationale: Same flattening as sp_electronic_energy_hartree.
  evidence: TCKDB:schemas/python/tckdb-schemas/tckdb_schemas/workflows/computed_reaction_upload.py:178
- kind: flattened_alias
  flat_field: freq_frequencies_cm1
  nested_tail: freq_result.modes[].frequency_cm1
  verdict: GENERALISES
  rationale: 'The flat list of signed frequencies is the modes[].frequency_cm1 column without the
    per-mode metadata. Same ARC source (statmech.harmonic_frequencies_cm1 plus the imaginary
    list). Caveat carried from A2: for a TS, harmonic_frequencies_cm1 drops every negative mode and
    the adapter re-inserts them as -abs(v), so mode order is reconstructed, not ESS order.'
  evidence: tckdb_arc/tckdb_arc/adapter.py:4660
- kind: flattened_alias
  flat_field: freq_reaction_coordinate_mode_index
  nested_tail: freq_result.reaction_coordinate_mode_index
  verdict: GENERALISES
  rationale: 'TS routes only: the minimum routes are NOT_APPLICABLE under AP-3 when nothing emits
    them. Same designation the nested field carries.'
  evidence: TCKDB:schemas/python/tckdb-schemas/tckdb_schemas/fragments/calculation.py:262
- kind: flattened_alias
  flat_field: freq_imaginary_dispositions
  nested_tail: freq_result.modes[].imaginary_disposition
  verdict: PARTIAL
  exceptions_patterns:
  - '^reaction_upload\.species\[\]\.'
  rationale: 'TS routes generalise from the nested per-mode disposition. The species routes do not:
    a disposition on a minimum''s spurious imaginary mode is a different object (the 0.22 ruling
    in §2.5), and ARC refuses a minimum with an imaginary mode outright.'
  evidence: tckdb_arc/tckdb_arc/adapter.py:4462
- kind: mapping_review
  rule_id: MR-1-aec-atom-params-read-dead-key
  pattern: '\.applied_energy_corrections\[\]\.scheme\.atom_params\[\]\.(element|value)$'
  verdict_override: ADAPTER_GAP
  rationale: 'The adapter fills scheme.atom_params only from correction.parameter_table.values when
    correction_type is atom_energy (adapter.py:285-291). ARC writes a parameter_table only on the
    Petersson bond-additivity record; the atom-energy record carries its per-element table as
    reference_atom_energies (ARC:arc/output.py:1575-1587), which the adapter never reads. So on
    current ARC output the atom_params leaves are never emitted although ARC exports the values.
    This is integration-gate finding C4. The values are Arkane''s per-element atomic energies at
    the scheme''s level (hartree, the same unit as the AEC total), which is what an atom-energy
    scheme''s parameters are; they are NOT per-atom corrections that sum to the total, so the fix
    must not reconstruct the total from them.'
  evidence: tckdb_arc/tckdb_arc/adapter.py:285
- kind: route_applicability
  rule_id: AP-8-scheme-workflow-tool
  pattern: '\.applied_energy_corrections\[\]\.scheme\.workflow_tool_release\.'
  verdict: DIFFERENT_INSTANCE
  rationale: 'A correction scheme''s workflow_tool_release names the tool "whose data file was the
    proximate source" of the scheme''s parameters (energy_correction.py EnergyCorrectionSchemeRef
    docstring). For ARC that is Arkane''s correction table (RMG-Py; whether the numbers live in
    RMG-Py or RMG-database is UNVERIFIED), not ARC. The 0.22 PARTIAL ruling on
    workflow_tool_release.* generalised these rows from the bundle-level ARC release because the
    scheme route did not exist at 0.22. Sending ARC here would be wrong provenance. ARC does export
    arkane_version / arkane_git_commit, which could identify the proximate tool; that is a policy
    call recorded in BRIDGE_ROADMAP.md, not a supply the join can assert.'
  evidence: TCKDB:schemas/python/tckdb-schemas/tckdb_schemas/energy_correction.py:69
- kind: route_applicability
  rule_id: AP-9-scheme-spin-treatment
  pattern: '\.applied_energy_corrections\[\]\.scheme\.level_of_theory\.spin_treatment$'
  verdict: DIFFERENT_INSTANCE
  rationale: 'Since 0.22 the calculation routes gained a spin_treatment supply (scf_reference.
    {freq,sp}_reference, observed from the freq/sp input). That observes the reference of ARC''s
    own jobs, not the level a correction scheme was fitted at. ARC''s Level has no spin-treatment
    attribute (§3 of this file), so the scheme leg stays unsupplied.'
  evidence: tckdb_arc/tckdb_arc/adapter.py:3419
- kind: route_applicability
  rule_id: AP-10-ts-conformer-key
  pattern: '^reaction_upload\.transition_state\.(calculation|calculations\[\])\.conformer_key$'
  verdict: VACUOUS
  rationale: 'conformer_key names a conformer declared by the calculation''s own species. At 0.51
    reaction_upload.transition_state has no conformers[] (geometry, calculation, calculations[]
    only), so there is nothing for a TS calculation to name.'
  evidence: TCKDB:schemas/python/tckdb-schemas/tckdb_schemas/workflows/computed_reaction_upload.py:899
- kind: mapping_review
  rule_id: MR-2-scheme-software-is-the-ess
  pattern: '\.applied_energy_corrections\[\]\.scheme\.software\.'
  when_verdicts: [ADAPTER_GAP, ROUTE_UNRESOLVED, WIRED, SOURCE_UNCONFIRMED]
  verdict_override: ARC_ABSENT
  rationale: 'A2 maps scheme.software.name/version from Arkane (model ''arkane_atom_energy'' /
    arkane_version). TCKDB defines scheme.software as "the program release that computed this
    scheme''s parameters (e.g. Gaussian 16, Revision C.02)" (energy_correction.py
    EnergyCorrectionSchemeRef docstring): the ESS build whose numerics the atom energies or bond
    parameters encode. Arkane looked the table up; it did not compute it. Arkane''s correction
    database records the model chemistry, not the program release that produced it, so ARC cannot
    honestly fill this field; filling it with Arkane would be wrong data under a field that is
    part of scheme identity. Missing it only warns (missing_energy_correction_scheme_software).
    Integration-gate finding A4 (schemes without software) is therefore a policy/TCKDB item, not
    an adapter gap.'
  evidence: TCKDB:schemas/python/tckdb-schemas/tckdb_schemas/energy_correction.py:54
- concept: software_release.revision
  kind: concept
  affected_rows: 14
  verdict: PARTIAL
  exceptions_patterns:
  - '(calculation|calculations\[\]|primary_opt|primary_calculation|additional_calculations\[\])\.software_release\.revision$'
  - '^reaction_upload\.software_release\.revision$'
  different_instance_verdict: ADAPTER_GAP
  rationale: 'Two objects share this tail. On thermo/statmech (and analysis) routes the release is
    Arkane''s and the RMG-Py commit (arkane_git_commit) generalises from species_upload.thermo /
    statmech to the reaction mirror. On calculation routes (and the bundle-level ESS
    reaction_upload.software_release) the release is the electronic-structure program''s: a
    different object from Arkane. It is not absent, though: ARC exports ess_versions as the full
    banner (''Gaussian 16, Revision C.01''; A2 fidelity_note on every
    …software_release.version row) and the adapter sends the whole banner as version
    (adapter.py:3437-3441) instead of splitting out the revision. So the calculation legs are
    ADAPTER_GAP, not ARC_ABSENT.'
  evidence: tckdb_arc/tckdb_arc/adapter.py:3437
