# repo: tckdb-adapters
- concept: geometry.isotopes
  affected_rows: 30
  verdict: GENERALISES
  rationale: 'Every geometry TCKDB can reach from either root is the same GeometryPayload class
    (fragments/geometry.py:7), and every one of them is serialised from an ARC xyz dict by xyz_to_str,
    which emits an isotope label only when isotope_format is passed — and no production ARC caller
    ever passes it. So the supply status is identical at all 30 routes AND at the sibling: none
    of them carries isotopes. CORRECTION TO A3, which Phase C must act on: A3''s row claims ARCSpecies.final_xyz[''isotopes'']
    is a trivial one-line export. It is not a valid source. final_xyz is always overwritten from
    a parsed ESS log (arc/scheduler.py:2487/2611/2614/3538), and every parse builds the dict through
    str_to_xyz''s defaults branch (arc/species/converter.py:112) or xyz_from_data(isotopes=None)
    (converter.py:447), which fill natural-abundance isotopes derived from the element symbol.
    Exporting them would assert natural abundance as a determined fact rather than record a substitution.
    The only place a user-declared substitution survives is spc.initial_xyz[''isotopes''] (converter.py:671),
    and the first successful opt destroys it. This is one gap, not 30, and its true effort is
    ''hard'', not ''trivial''.'
  evidence: ARC:arc/species/converter.py:112
  exceptions: []
- concept: level_of_theory.spin_treatment
  affected_rows: 15
  verdict: PARTIAL
  rationale: 'Split by parent. The applied_energy_corrections[].scheme.level_of_theory routes
    DO generalise: ARC writes the scheme''s level through the very same helper that writes opt_level
    / freq_level / sp_level — _level_to_dict (ARC:arc/output.py:262), invoked for the run-level
    arkane_level_of_theory at ARC:arc/output.py:133 and embedded per correction record as energy_corrections[].level_of_theory
    at ARC:arc/output.py:878 and :913, where the JSON schema makes it a required $ref to the same
    level_dict $def. The adapter projects it with the same parent-agnostic projector the calculation
    LoT uses, _scheme_level_of_theory (tckdb_arc/tckdb_arc/adapter.py:4461) delegating to _arc_level_to_tckdb_lot
    (tckdb_arc/tckdb_arc/adapter.py:4438). A2 inventoried only the .method leaf of that dict and
    said so explicitly (''Full level_dict leaf mapping applies''), which is why the other leaves
    fell through the join. Caveat: Level.as_dict() omits None-valued keys rather than nulling
    them, so availability is conditional per leaf. The applied_energy_corrections[].frequency_scale_factor.level_of_theory
    routes do NOT generalise — see level_of_theory.method.WARNING for Phase C: the eleven generalising
    routes generalise a NULL supply. ARC''s Level object has no spin-treatment attribute and _level_to_dict
    (ARC:arc/output.py:262) cannot emit one, so spin_treatment is unsupplied at every route including
    the sibling. The sibling''s matrix verdict ADAPTER_GAP is itself wrong — A2''s row has arc_key:
    null and availability: rare. The correct verdict at all 15 routes is ARC_ABSENT; treat them
    as one fact, not fifteen gaps.'
  evidence: tckdb_arc/tckdb_arc/adapter.py:4438
  exceptions:
  - reaction_upload.species[].applied_energy_corrections[].frequency_scale_factor.level_of_theory.spin_treatment
  - reaction_upload.transition_state.applied_energy_corrections[].frequency_scale_factor.level_of_theory.spin_treatment
  - species_upload.applied_energy_corrections[].frequency_scale_factor.level_of_theory.spin_treatment
  - species_upload.thermo.applied_energy_corrections[].frequency_scale_factor.level_of_theory.spin_treatment
- concept: workflow_tool_release.git_commit
  affected_rows: 14
  verdict: PARTIAL
  rationale: 'Four routes generalise cleanly and ten do not. GENERALISING: statmech.freq_scale_factor
    .workflow_tool_release (both roots), species_upload.statmech.workflow_tool_release and species_upload.thermo.workflow_tool_release.
    All four name the same object the sibling names — the ARC release that ran the workflow —
    and the adapter has exactly one builder for it, _arc_workflow_tool_release (tckdb_arc/tckdb_arc/adapter.py:4837),
    reading run-level arc_version / arc_git_commit; it is already threaded to the freq-scale-factor
    ref at tckdb_arc/tckdb_arc/adapter.py:4985. NOT GENERALISING: the six execution_environment.workflow_tool_release
    routes, whose model is WorkflowToolReleaseIdentity (fragments/execution_environment.py:234)
    inside a manifest that also demands schema_version, runtime and executable — the adapter emits
    no execution_environment anywhere and ARC exports no runtime manifest; and the four applied_energy_corrections[].frequency_scale_factor.workflow_tool_release
    routes, where the whole frequency_scale_factor block is unsupplied (see level_of_theory.method).'
