[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tckdb-arc"
version = "0.14.2"
description = "ARC → TCKDB upload adapter (payload builder + sidecar writer + uploader)."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "tckdb-adapters-core>=0.4.2,<0.5",  # producer-agnostic upload pipeline, numerics, rules, test kit
    "tckdb-client>=0.184,<0.185",   # tested transport + replay contract
    "tckdb-schemas>=0.154,<0.155", # the producer contract module ships from 0.52
    "PyYAML>=6",                  # vendored read_yaml_file
]

[project.optional-dependencies]
# NOTE: ARC is NOT pip-installable as `arc` from PyPI — it is a conda/PYTHONPATH
# install. This extra is a *documented marker* only; it does NOT resolve ARC via
# pip. The three parser-coupled paths (Hessian / IRC / GSM) degrade gracefully
# through tckdb_arc._arc_optional when ARC is not importable. Run the arc-gated
# tests only where ARC is already on the path.
arc = []
test = ["pytest", "jsonschema>=4.18"]  # jsonschema: contract JSON Schema checks

[project.scripts]
tckdb-arc-upload = "tckdb_arc.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tckdb_arc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../tckdb_core"]  # sibling core + this package ahead of cwd/editable installs from another checkout
