# ARC output.yml schema 1.2 thermo corpus. Header levels follow the golden
# phase3_output.yml (still 1.1, kept as the legacy fixture), bumped to 1.2 and
# lowercased as ARC's Level writes them; the hyphenated wb97x-d/def2-tzvp
# sp_level vs CH4's wb97xd/def2tzvp atom_corrections_level is a spelling
# difference only. Every species carries the 1.2 thermo keys
# atom_corrections_applied / bond_corrections_applied / atom_corrections_level
# (ARC feature_export_atom_corrections_applied, a10e8ae0). Species whose switch
# was false carry no energy_corrections records, as ARC drops them. No evidence
# descriptor: this corpus exercises thermo only.
#
# Values: CH4 NASA are the GRI-Mech 3.0 fits (H(298.15 K) = -74.6 kJ/mol).
# "Uncorrected" enthalpies are the raw electronic energy plus the thermal
# increment, as Arkane reports them without atom corrections: CH4 -40.5 Eh,
# H -0.5 Eh (-1306.5 kJ/mol), H2 -1.17 Eh (-3037.0 kJ/mol). The H and H2 values
# sit below the magnitude guard's 2e4 kJ/mol bound, so only the flag catches them.
schema_version: '1.2'
project: arc_1_2_thermo
arc_version: 1.1.0
arc_git_commit: a10e8ae0
opt_level: {method: wb97x-d, basis: def2-svp, software: gaussian}
freq_level: {method: wb97x-d, basis: def2-svp, software: gaussian}
sp_level: {method: wb97x-d, basis: def2-tzvp, method_type: dft, software: gaussian}
composite_method: null
