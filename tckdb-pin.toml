# The TCKDB source revision CI installs tckdb-schemas and tckdb-client from.
# Read by .github/workflows/ci.yml and moved by tools/tckdb_drift.py --bump (kept
# out of the workflow files so an automated bump never edits .github/workflows/).
[tckdb]
repo = "https://github.com/calvinp0/tckdbv2.git"
sha = "f79e7f94029537398da4098b3f9fabe795cef743"
schemas_subdir = "schemas/python/tckdb-schemas"
client_subdir = "clients/python"
