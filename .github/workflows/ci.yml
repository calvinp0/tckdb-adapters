name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Lets tckdb-drift.yml start CI on the PR it opens (a PR created with GITHUB_TOKEN
  # does not trigger pull_request workflows by itself).
  workflow_dispatch:

jobs:
  tckdb-arc:
    name: tckdb-arc (base, no-ARC)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: tckdb_arc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Read the TCKDB pin
        # tckdb-pin.toml (repo root) holds the tested TCKDB commit; it is kept out
        # of the workflow files so tools/tckdb_drift.py --bump never edits them.
        # The tool fails loudly if the file or its sha is malformed.
        run: python ../tools/tckdb_drift.py --install-specs >> "$GITHUB_ENV"

      - name: Install the shared layer (tested source revision)
        run: |
          python -m pip install --upgrade pip
          pip install "$TCKDB_CLIENT_SPEC" "$TCKDB_SCHEMAS_SPEC"

      - name: Install tckdb-arc (base + test extra)
        run: pip install -e ".[test]"

      - name: Run the base (no-ARC) test suite
        # ARC is NOT installed here, so the arc-coupled tests self-skip via
        # pytest.importorskip("arc"). The base suite must be fully green.
        run: pytest -q

  # ── ARC-coupled leg (documented, NOT run in CI) ──────────────────────────
  # ARC is a conda/PYTHONPATH install, not a PyPI package, so CI cannot
  # `pip install arc`. To exercise the arc-gated tests (freq-Hessian / IRC /
  # GSM reparse), run the suite in an environment that already has ARC on the
  # PYTHONPATH (e.g. ARC's `arc_env` on a dev box / zeus):
  #
  #     conda run -n arc_env pip install -e "tckdb_arc[test]"
  #     conda run -n arc_env pytest tckdb_arc/tests -q
  #
  # There the 12 `importorskip("arc")` tests execute instead of skipping.
